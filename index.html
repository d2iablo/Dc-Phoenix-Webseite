<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DC Phönix Durmersheim</title>
<meta name="description" content="DC Phönix Durmersheim – Dartverein in der Badischen Dart Liga: Spielplan, Tabellen, Spieler.">
<meta property="og:type" content="website">
<meta property="og:title" content="DC Phönix Durmersheim">
<meta property="og:description" content="Dartverein in der Badischen Dart Liga: Spielplan, Tabellen, Spieler.">
<meta property="og:image" content="https://dcphoenix.de/logo-share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://dcphoenix.de/logo-share.png">
<meta name="theme-color" content="#070707">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" sizes="48x48" href="logo-favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="logo-favicon.png">
<link rel="apple-touch-icon" href="logo-apple.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DC Phönix">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{--dart:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><path d='M20 4 10 14'/><path d='m20 4-4 .5L19.5 8z'/><path d='m10 14-3.5.5.5-3.5L5 13l-2 5 1 1 5-2z'/></svg>");--bg:#070707;--bg2:#101010;--card:#121212;--card2:#191919;--line:rgba(255,255,255,.12);--fg:#F4F4F2;--mute:#9A9A96;--a1:#FFFFFF;--a2:#B4B4AF;--a-fg:#0A0A0A;--own:rgba(255,255,255,.09);--win:#6CD08A;--loss:#FF7B63;--warn-bg:#262626;--warn-fg:#E8E8E4;--logo-filter:grayscale(1) contrast(1.12);--logo-blend:normal;--logo-op:1;--shadow:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
h1,h2,h3,p{margin:0}
h1,h3{text-wrap:balance}
button{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.banner{background:var(--warn-bg);color:var(--warn-fg);font-size:.82rem;padding-block:7px;padding-top:calc(7px + env(safe-area-inset-top,0px))}

/* Kopfleiste */
.bar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar .wrap{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;font-size:.95rem;flex:none;padding-block:8px}
.brand img{width:34px;height:34px;border-radius:50%;object-fit:cover;filter:var(--logo-filter)}
.brand span{display:none}
@media (min-width:560px){.brand span{display:inline}}
.rtx{grid-column:1/-1;width:100%;margin-top:14px;border:1px solid var(--line);border-radius:16px;background:var(--card2,var(--card));overflow:hidden}
.rtxh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.rtxh b{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.rtxb{white-space:pre-wrap;padding:14px;font-size:.92rem;line-height:1.55;overflow-wrap:anywhere}
.sbox{display:grid;gap:12px}
.sbnum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sbn{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 0,color-mix(in srgb,var(--fg) 11%,var(--card)),var(--card) 62%);border:1px solid var(--line);border-radius:22px;padding:20px 12px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;transition:transform .25s,border-color .25s}
.sbn:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--fg) 40%,transparent)}
.ring{position:relative;width:clamp(78px,24vw,118px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .tr{fill:none;stroke:color-mix(in srgb,var(--fg) 14%,transparent);stroke-width:7}
.ring .pr{fill:none;stroke:var(--fg);stroke-width:7;stroke-linecap:round;stroke-dasharray:276.5;stroke-dashoffset:276.5;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 4px color-mix(in srgb,var(--fg) 35%,transparent))}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.ring b{font-size:clamp(1.5rem,6.4vw,2.4rem);font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ring i{font-style:normal;font-size:.68rem;font-weight:700;color:var(--mute);margin-top:3px}
.sbn small{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fg);font-weight:800;line-height:1.25}
.sbn em{font-style:normal;font-size:.74rem;color:var(--mute);margin-top:-6px}
.sbinf{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:0}
.sbi{position:relative;overflow:hidden;display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px;min-width:0;transition:transform .25s,border-color .25s}
.sbi:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--fg) 40%,transparent)}
.sbi.wide{grid-column:1/-1;padding:20px 22px;background:linear-gradient(120deg,color-mix(in srgb,var(--fg) 10%,var(--card)),var(--card) 60%)}
.sbi.wide dd{font-size:1.3rem}
.sbi.wide::after{content:"";position:absolute;right:18px;top:50%;width:92px;height:92px;transform:translateY(-50%);opacity:.06;background:currentColor;-webkit-mask:var(--dart) center/contain no-repeat;mask:var(--dart) center/contain no-repeat;pointer-events:none}
.sbi .ic{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--fg) 10%,transparent)}
.sbx{min-width:0}
.sbinf dt{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:800;margin:0 0 3px}
.sbinf dd{margin:0;font-weight:800;font-size:1.05rem;overflow-wrap:break-word}
.sbinf em{display:block;font-style:normal;font-size:.8rem;color:var(--mute);margin-top:2px}
@media(max-width:520px){.sbnum{gap:8px}.sbn{padding:14px 6px 12px;border-radius:18px}.sbn small{font-size:.58rem;letter-spacing:.08em}.sbn em{font-size:.66rem}.sbinf{grid-template-columns:1fr 1fr;gap:8px}.sbi{flex-direction:column;align-items:flex-start;gap:10px;padding:14px}.sbi.wide{flex-direction:row;align-items:center}.sbi.wide dd{font-size:1.1rem}}
@media(prefers-reduced-motion:reduce){.ring .pr{transition:none}.sbn,.sbi{transition:none}}
.sbinf dt{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:800;margin:0 0 4px}
.sbinf dd{margin:0;font-weight:700;font-size:1.05rem;overflow-wrap:break-word}
.acct{flex:none;display:flex;gap:6px;align-items:center}.acct a,.acct button{font:inherit;font-weight:800;font-size:.82rem;text-decoration:none;color:var(--fg);background:var(--card);border:1px solid var(--line);padding:7px 12px;border-radius:999px;cursor:pointer;line-height:1.2;white-space:nowrap}.acct a.pri{background:var(--a1);color:var(--a-fg);border-color:transparent}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:9px;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
@media (min-width:760px){.tabs{justify-content:flex-end}}
.tabs a{flex:none;text-decoration:none;font-weight:700;font-size:.9rem;padding:7px 14px;border-radius:999px;color:var(--mute)}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-current="page"]{color:var(--a-fg);background:var(--a1)}

/* Hero (nur Start) */
.hero{position:relative;overflow:hidden;isolation:isolate;min-height:min(74vh,560px);display:flex;align-items:flex-end;padding-block:48px 40px;background:radial-gradient(60% 80% at 80% 20%,color-mix(in srgb,var(--fg) 9%,transparent),transparent 70%),var(--bg)}
.hero .wrap{width:100%}
.hero .logo{position:absolute;z-index:-1;right:-6%;top:44%;width:min(112vw,600px);aspect-ratio:1;object-fit:cover;transform:translateY(-52%);filter:var(--logo-filter);mix-blend-mode:var(--logo-blend);opacity:var(--logo-op);-webkit-mask-image:radial-gradient(closest-side,#000 70%,transparent 100%);mask-image:radial-gradient(closest-side,#000 70%,transparent 100%)}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 90%,transparent) 28%,transparent 60%),linear-gradient(90deg,var(--bg) 0%,transparent 55%)}
.eyebrow{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);font-weight:700}
.hero h1{font-size:clamp(2.8rem,13vw,5.6rem);line-height:.92;font-weight:900;letter-spacing:-.035em;text-transform:uppercase;margin-top:12px;max-width:11ch}
.hero h1 span{display:block}
.hero .sub{margin-top:14px;max-width:34ch;color:var(--mute);font-size:1.05rem}
.hero .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem;text-decoration:none;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--a2)}
.btn.pri{background:var(--a1);color:var(--a-fg);border-color:transparent}
.btn.ico{padding:10px;width:42px;height:42px;justify-content:center}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn svg.f{fill:currentColor;stroke:none}
.btn.sm{padding:6px 12px;font-size:.8rem;font-weight:700}

main{padding-block:26px 56px;display:grid;gap:34px}
section{min-width:0}
h2{font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
h2 a{order:3;font-size:.72rem;letter-spacing:.1em;color:var(--a2);text-decoration:none;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.card:has(details[open]),.fix li:has(details[open]){position:relative;z-index:40}
.page-h{display:grid;gap:6px}
.page-h h1{font-size:clamp(2rem,9vw,3.4rem);font-weight:900;letter-spacing:-.03em;text-transform:uppercase;line-height:1}
.page-h p{color:var(--mute)}
.back{display:inline-block;margin-bottom:10px;color:var(--mute);text-decoration:none;font-weight:700;font-size:.88rem}
.back:hover{color:var(--fg)}
.lead{font-size:1.1rem;line-height:1.55}
.todo{color:var(--mute);font-style:italic}
.pad{padding-top:10px}

/* Kennzahlen */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.tile small{display:block;color:var(--mute);text-transform:uppercase;letter-spacing:.14em;font-size:.64rem;font-weight:700}
.tile b{display:block;font-size:1.45rem;margin-top:3px;font-weight:900;letter-spacing:-.02em;overflow-wrap:anywhere;line-height:1.15}
.tile span{display:block;color:var(--mute);font-size:.8rem;margin-top:2px;overflow-wrap:anywhere}
.tiles.big b{font-size:1.9rem}

/* Teamkarten */
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.tc{display:flex;flex-direction:column;text-decoration:none;border-radius:22px;border:1px solid var(--line);background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
.tc .ph{aspect-ratio:16/7;background:var(--card2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.tc .ph img{width:100%;height:100%;object-fit:cover}
.tc .ph.none{background:linear-gradient(135deg,var(--card2),var(--bg2))}
.tc .ph.none b{font-size:2.4rem;font-weight:900;letter-spacing:-.04em;color:var(--a2);opacity:.6}
.tc .bd{padding:16px 18px 18px;display:grid;gap:6px}
.tc h3{font-size:1.3rem;font-weight:900;letter-spacing:-.02em;text-transform:uppercase;line-height:1.1}
.tc .lg{color:var(--mute);font-size:.88rem}
.tc .rk{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px;font-weight:800}
.form{display:inline-flex;gap:4px;vertical-align:middle}
.form i{display:block;width:10px;height:10px;border-radius:50%;background:var(--mute);opacity:.5}
.form i.w{background:var(--win);opacity:1}.form i.l{background:var(--loss);opacity:1}
.form i.u{background:var(--a2);opacity:1}

/* Spielzeilen */
.fix{display:grid;gap:10px;padding:0;margin:0;list-style:none}
.fix li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px 12px 12px}
.fix li.past .dt{opacity:.8}
.dt{width:56px;text-align:center;border-radius:14px;padding:8px 0;background:var(--bg2);border:1px solid var(--line);line-height:1}
.dt i{display:block;font-style:normal;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}
.dt b{display:block;font-size:1.6rem;font-weight:900;margin:4px 0 2px;letter-spacing:-.03em}
.dt small{display:block;font-size:.64rem;color:var(--a2);font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.fix .m{min-width:0;overflow-wrap:anywhere;display:grid;gap:3px}
.fix .tl{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--a2);font-weight:800}
.fix .vs{font-weight:800;line-height:1.25}
.fix .tm{color:var(--mute);font-size:.88rem}
.fix .tm b{color:var(--fg)}
.fix .r{font-size:1.3rem;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.fix .r.w{color:var(--win)}.fix .r.l{color:var(--loss)}.fix .r.n{color:var(--mute);font-weight:600;font-size:1rem}
.fix .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.fix .count{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 9px;border-radius:999px;background:var(--a1);color:var(--a-fg);justify-self:start}
.pill{display:inline-block;font-size:.64rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 9px;border-radius:999px;margin-right:8px;vertical-align:1px;line-height:1.5}
.pill.h{background:var(--a1);color:var(--a-fg)}
.pill.g{border:1.5px solid var(--a2);color:var(--a2)}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--card);border:1px solid var(--line);margin-bottom:12px}
.seg button{border:0;background:transparent;color:var(--mute);font-weight:800;font-size:.85rem;padding:7px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--a1);color:var(--a-fg)}
.hero-next{border:2px solid var(--a1)}
.btn.more{width:100%;justify-content:center;margin-top:10px}

/* Menüs (Kalender / Route) */
details.menu{position:relative}
details.menu>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.8rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card2);user-select:none}
details.menu>summary::-webkit-details-marker{display:none}
details.menu>summary::after{content:"▾";font-size:.75em;color:var(--mute)}
details.menu[open]>summary{border-color:var(--a2)}
details.menu .mp{position:absolute;left:0;top:calc(100% + 6px);z-index:60;min-width:220px;max-width:min(300px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 14px 40px rgba(0,0,0,.45);display:grid;gap:2px}
details.menu .mp a,details.menu .mp button{display:block;text-align:left;text-decoration:none;background:transparent;border:0;border-radius:10px;padding:10px 12px;font-weight:700;font-size:.9rem;cursor:pointer;color:var(--fg)}
details.menu .mp a:hover,details.menu .mp button:hover{background:var(--own)}
details.menu .mp small{display:block;color:var(--mute);font-weight:500;font-size:.76rem}

/* Spielbericht */
.report{grid-column:1/-1;border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
.report .rh{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;margin-bottom:8px}
.report .rh span{color:var(--mute)}
table.rt{width:100%;font-size:.9rem}
table.rt td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:normal;vertical-align:middle;width:auto}
table.rt td.sc{text-align:center;font-weight:900;white-space:nowrap;width:70px;font-size:1.05rem}
table.rt td.r2{text-align:right}
table.rt tr.dbl td{background:color-mix(in srgb,var(--a2) 8%,transparent)}
table.rt tr.ex td{font-size:.78rem;color:var(--a2);padding-top:0;text-align:center}
.report .rf{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:10px;font-size:.85rem;color:var(--mute)}
.report .rf b{color:var(--fg)}
.report .rf a{color:var(--a2)}

/* Tabellen */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:11px 10px;text-align:right;white-space:nowrap}
th{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{padding-left:14px;text-align:center;width:42px;color:var(--mute);font-weight:700}
th:nth-child(2),td:nth-child(2){text-align:left;white-space:normal;min-width:0}
th:last-child,td:last-child{padding-right:14px}
tr.own td{background:var(--own);font-weight:800}
tr.own td:first-child{box-shadow:inset 4px 0 0 var(--a1);color:var(--a2)}
caption{padding:16px;color:var(--mute);text-align:left}
#tbl td:last-child{font-weight:900}
@media (max-width:640px){.hide-s{display:none}}

/* Avatare und Spieler */
.av{position:relative;flex:none;border-radius:50%;background:linear-gradient(135deg,var(--card2),var(--bg2));border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:900;color:var(--a2);letter-spacing:-.02em;width:40px;height:40px;font-size:.9rem}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.m{width:64px;height:64px;font-size:1.3rem}
.av.l{width:112px;height:112px;font-size:2.2rem}
.av.sq{border-radius:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 10px}
.pc:hover{border-color:var(--a2)}
.pc b{font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.pc small{color:var(--mute);font-size:.8rem}
.pc .rl{color:var(--a2);font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.top{display:grid;gap:10px;padding:0;margin:0;list-style:none}
.top li a{display:flex;align-items:center;gap:14px;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px}
.top li a:hover{border-color:var(--a2)}
.top .nr{font-size:1.3rem;font-weight:900;color:var(--mute);width:22px;text-align:center}
.top .nm{flex:1;min-width:0}
.top .nm b{display:block;font-weight:800;overflow-wrap:anywhere}
.top .nm small{color:var(--mute)}
.top .pt{font-weight:900;font-size:1.2rem;text-align:right;line-height:1.1}
.top .pt small{display:block;font-size:.66rem;color:var(--mute);letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

}

<script>
(function(){
"use strict";
var CFG=null,DATA=null,PH={},PROF={},ALL=null,FXI={};
var $=function(id){return document.getElementById(id)};
function el(tag,txt,cls){var e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e}
function norm(s){return String(s||"").trim().toLowerCase()}
function slug(s){return norm(s).replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function short(n){return String(n||"").replace(/^DC Phönix\s*/i,"")||n}
function parts(iso){var p=iso.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);
  return {w:d.toLocaleDateString("de-DE",{weekday:"short"}).replace(".",""),day:String(+p[2]),mon:d.toLocaleDateString("de-DE",{month:"short"}).replace(".",""),full:d.toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"long",year:"numeric"}),kurz:d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}}
function when(f){var p=f.datum.split("-"),t=(f.zeit||"20:00").split(":");return new Date(+p[0],+p[1]-1,+p[2],+t[0]||20,+t[1]||0)}
function safeUrl(u){return /^https?:\/\//i.test(u||"")?u:null}
function getJSON(u){return fetch(u,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(u+" "+r.status);return r.json()})}
function nextOf(t){var now=Date.now(),fx=(t.fixtures||[]).slice().sort(function(a,b){return a.datum<b.datum?-1:1}),n=null;
  fx.forEach(function(f){if(!n&&!f.ergebnis&&when(f).getTime()+4*3600e3>now)n=f});return n}
function isUpcoming(f){return !f.ergebnis&&when(f).getTime()+4*3600e3>Date.now()}
function daysTo(f){var now=new Date(),p=f.datum.split("-");
  return Math.round((new Date(+p[0],+p[1]-1,+p[2])-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5)}
function dayTxt(d){return d<=0?"Heute":d===1?"Morgen":"In "+d+" Tagen"}
function rank(t){return (t.table||[]).filter(function(x){return norm(x.team)===norm(t.name)})[0]||null}
function pill(f,t){var h=norm(f.heim)===norm(t.name),a=!h&&norm(f.gast)===norm(t.name);
  if(!f.heim||!(h||a))return null;return el("span",h?"Heim":"Gast","pill "+(h?"h":"g"))}
function venue(f){if(!f.heim)return "";var k=norm(f.heim),sp=CFG.spielorte||{},a="";
  for(var n in sp)if(norm(n)===k)a=sp[n];
  if(!a&&CFG.teams.some(function(c){return norm(c.name)===k}))a=CFG.verein.spiellokal||"";return a}
function isFree(f){return /spielfrei/i.test((f.heim||"")+" "+(f.gast||""))}
function vsText(f){return isFree(f)?"Spielfrei":f.heim?f.heim+" – "+f.gast:"Gegner folgt"}
function dateBox(f){var p=parts(f.datum),d=el("div",null,"dt");d.appendChild(el("i",p.w));d.appendChild(el("b",p.day));d.appendChild(el("small",p.mon));return d}
function sec(title,node,more){var s=el("section");if(title){var h=el("h2",title);if(more){var a=el("a",more[0]);a.href=more[1];h.appendChild(a)}s.appendChild(h)}if(node)s.appendChild(node);return s}
function tile(label,val,sub){var d=el("div",null,"tile");d.appendChild(el("small",label));d.appendChild(el("b",val));if(sub)d.appendChild(el("span",sub));return d}
function extLink(u,txt){var a=el("a",txt);a.href=u;a.target="_blank";a.rel="noopener";return a}

/* ---------- Fotos ---------- */
function photoUrl(folder,key,explicit){
  if(explicit&&(safeUrl(explicit)||/^[\w.\-\/ ]+$/.test(explicit)))return explicit;
  var l=PH[folder]||[],s=slug(key);
  for(var i=0;i<l.length;i++){if(slug(l[i].replace(/\.[^.]+$/,""))===s)return "fotos/"+folder+"/"+encodeURIComponent(l[i])}
  return null}
function initials(n){var w=String(n||"").trim().split(/\s+/).filter(Boolean);if(!w.length)return "?";
  return (w[0][0]+(w.length>1?w[w.length-1][0]:"")).toUpperCase()}
function avatar(name,url,cls){var a=el("div",null,"av "+(cls||""));a.appendChild(document.createTextNode(initials(name)));
  if(url){var i=document.createElement("img");i.alt=name;i.loading="lazy";i.onerror=function(){i.remove()};i.src=url;a.appendChild(i)}return a}
function playerInfo(name){var o=CFG.spieler||{},r={},k;for(k in o)if(norm(k)===norm(name)){var c=o[k]||{};for(var x in c)r[x]=c[x]}
  for(k in PROF)if(norm(k)===norm(name)){var q=PROF[k]||{};for(var y in q)if(q[y]!==""&&q[y]!=null)r[y]=q[y]}return r}
function playerPhoto(name){return photoUrl("spieler",name,playerInfo(name).foto)}

/* ---------- Karten, Kalender ---------- */
function mapLinks(addr){var q=encodeURIComponent(addr);return [
  {t:"In Google Maps öffnen",href:"https://www.google.com/maps/dir/?api=1&destination="+q},
  {t:"In Apple Karten öffnen",href:"https://maps.apple.com/?daddr="+q+"&dirflg=d"}]}
function menu(label,items,cls){
  var d=el("details",null,"menu"+(cls?" "+cls:""));d.appendChild(el("summary",label));var p=el("div",null,"mp");
  items.forEach(function(it){var a;
    if(it.href){a=el("a");a.href=it.href;a.target="_blank";a.rel="noopener"}
    else{a=el("button");a.type="button";a.onclick=function(){it.fn();d.open=false}}
    a.appendChild(document.createTextNode(it.t));if(it.sub)a.appendChild(el("small",it.sub));p.appendChild(a)});
  d.appendChild(p);return d}
function two(n){return (n<10?"0":"")+n}
function stamp(d){return d.getUTCFullYear()+two(d.getUTCMonth()+1)+two(d.getUTCDate())+"T"+two(d.getUTCHours())+two(d.getUTCMinutes())+"00"}
function fixEv(f,t){return {datum:f.datum,zeit:f.zeit,titel:"Dart: "+f.heim+" – "+f.gast,ort:venue(f),beschr:(t.liga_name||"")+(f.spieltag?" · "+f.spieltag+". Spieltag":"")+" · Badische Dart Liga",uid:(t.liga||"liga")+"-"+(f.id||f.datum)+"-"+slug(f.heim),dauer:3,alarm:"-PT3H"}}
function startEnd(ev){var p=ev.datum.split("-"),t=(ev.zeit||"20:00").split(":");
  var s=new Date(Date.UTC(+p[0],+p[1]-1,+p[2],+t[0]||0,+t[1]||0)),e=new Date(s.getTime()+(ev.dauer||3)*3600e3);return [stamp(s),stamp(e)]}
function esc(s){return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n")}
function fold(l){var o=[];while(l.length>60){o.push(l.slice(0,60));l=" "+l.slice(60)}o.push(l);return o.join("\r\n")}
function icsText(ev){var se=startEnd(ev),now=new Date();
  var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//DC Phoenix Durmersheim//Kalender//DE","CALSCALE:GREGORIAN","METHOD:PUBLISH",
  "BEGIN:VTIMEZONE","TZID:Europe/Berlin","BEGIN:DAYLIGHT","TZOFFSETFROM:+0100","TZOFFSETTO:+0200","TZNAME:CEST","DTSTART:19700329T020000","RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU","END:DAYLIGHT",
  "BEGIN:STANDARD","TZOFFSETFROM:+0200","TZOFFSETTO:+0100","TZNAME:CET","DTSTART:19701025T030000","RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU","END:STANDARD","END:VTIMEZONE",
  "BEGIN:VEVENT","UID:"+ev.uid+"@dc-phoenix","DTSTAMP:"+stamp(now)+"Z",
  "DTSTART;TZID=Europe/Berlin:"+se[0],"DTEND;TZID=Europe/Berlin:"+se[1],"SUMMARY:"+esc(ev.titel)];
  if(ev.ort)L.push("LOCATION:"+esc(ev.ort));
  if(ev.beschr)L.push("DESCRIPTION:"+esc(ev.beschr));
  L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+esc(ev.titel),"TRIGGER:"+(ev.alarm||"-PT3H"),"END:VALARM","END:VEVENT","END:VCALENDAR");
  return L.map(fold).join("\r\n")+"\r\n"}
function isIOS(){return /iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)}
function addToCalendar(ev){var txt=icsText(ev);
  if(isIOS()){location.href="data:text/calendar;charset=utf-8,"+encodeURIComponent(txt);return}
  var b=new Blob([txt],{type:"text/calendar;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download="termin-"+ev.datum+".ics";document.body.appendChild(a);a.click();
  setTimeout(function(){a.remove();URL.revokeObjectURL(u)},4000)}
function googleCal(ev){var se=startEnd(ev);
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(ev.titel)+"&dates="+se[0]+"/"+se[1]+"&ctz=Europe%2FBerlin&location="+encodeURIComponent(ev.ort||"")+"&details="+encodeURIComponent(ev.beschr||"")}
function calMenu(ev){return menu("Kalender",[
  {t:"Zum Kalender hinzufügen",sub:"iPhone, Android, Outlook (.ics)",fn:function(){addToCalendar(ev)}},
  {t:"Google Kalender",sub:"öffnet im Browser oder in der App",href:googleCal(ev)}])}
function routeMenu(addr){return menu("Route",mapLinks(addr))}
function phoneOf(){var v=CFG.verein,src=(v.probetraining&&v.probetraining.telefon)||v.kontakt||"",m=String(src).match(/\+?\d[\d\s\/\-()]{7,}\d/);return m?m[0].trim():""}
function trialMenu(){var ph=phoneOf();if(!ph)return null;var d=ph.replace(/[^\d+]/g,""),wa=d.replace(/^\+/,"").replace(/^00/,"").replace(/^0/,"49");
  return menu("Probetraining anfragen",[{t:"Anrufen",sub:ph,href:"tel:"+d},{t:"Per WhatsApp schreiben",sub:ph,href:"https://wa.me/"+wa+"?text="+encodeURIComponent("Hallo, ich habe Interesse an einem Probetraining bei "+CFG.verein.name+".")}],"pri")}

/* ---------- Spielzeile ---------- */
function pv(o,i,n){if(!o)return {};function g(a){a=a||[];return a.length===n?a[i]:(a.length===1&&n===1?a[0]:null)}
  return {sl:g(o.sl),hf:g(o.hf),max:g(o.max)}}
function extras(g){var out=[];
  [["heim","h"],["gast","g"]].forEach(function(s){g[s[0]].forEach(function(n,i){var v=pv(g[s[1]],i,g[s[0]].length),b=[];
    if(v.sl)b.push("SL "+v.sl);if(v.hf)b.push("HF "+v.hf);if(v.max)b.push("Max "+v.max);
    if(b.length)out.push(n+": "+b.join(" · "))})});
  return out.join("   ")}
function reportOf(f){return f.id&&DATA.reports?DATA.reports[f.id]:null}
function isOwnTeam(n){return CFG.teams.some(function(t){return norm(t.name)===norm(n)})}
function reportText(r){
  var ownH=isOwnTeam(r.heim),own=ownH?"heim":"gast",opp=ownH?"gast":"heim",os=ownH?0:1,ps=ownH?1:0,ok=ownH?"h":"g";
  var team=short(r[own]),gegner=r[opp],sp=r.spiele||[];
  var mine=0,theirs=0;
  if(r.sets){mine=r.sets[os];theirs=r.sets[ps]}else{sp.forEach(function(g){if(g.ergebnis[os]>g.ergebnis[ps])mine++;else if(g.ergebnis[os]<g.ergebnis[ps])theirs++})}
  var diff=Math.abs(mine-theirs),win=mine>theirs,draw=mine===theirs;
  var verb=draw?"trennt sich unentschieden von":win?(diff>=6?"gewinnt klar gegen":diff<=1?"gewinnt knapp gegen":"gewinnt gegen"):(diff>=6?"verliert deutlich gegen":diff<=1?"verliert knapp gegen":"verliert gegen");
  var ort=ownH?"zu Hause":"auswärts";
  var t="🎯 "+team+" "+verb+" "+gegner+" ("+mine+":"+theirs+", "+ort+").";
  if(r.legs)t+=" Legs: "+r.legs[os]+":"+r.legs[ps]+".";
  var ew=0,el2=0,dw=0,dl=0,st={};
  sp.forEach(function(g){var a=g.ergebnis[os],b=g.ergebnis[ps],w=a>b,l=a<b;
    if(g.typ==="Doppel"){if(w)dw++;else if(l)dl++}else{if(w)ew++;else if(l)el2++}
    (g[own]||[]).forEach(function(n){var o=st[n]||(st[n]={n:n,sp:0,w:0,hf:[],sl:[],mx:0});o.sp++;if(w)o.w++;
      var v=pv(g[ok],(g[own]||[]).indexOf(n),(g[own]||[]).length);if(v.hf)o.hf.push(v.hf);if(v.sl)o.sl.push(v.sl);if(v.max)o.mx+=v.max})});
  t+="\n\nEinzel "+ew+":"+el2+", Doppel "+dw+":"+dl+".";
  var pl=Object.keys(st).map(function(k){return st[k]}).filter(function(o){return o.sp>0});
  var best=0;pl.forEach(function(o){if(o.w>best)best=o.w});
  if(best>=2){var bn=pl.filter(function(o){return o.w===best});
    t+="\n\n⭐ Spieler des Tages: "+bn.map(function(o){return o.n+" ("+o.w+" Siege aus "+o.sp+" Spielen)"}).join(" und ")+"."}
  var hl=[];pl.forEach(function(o){var b=[];
    o.hf.forEach(function(x){b.push("High Finish "+x)});o.sl.forEach(function(x){b.push("Short Leg in "+x+" Darts")});if(o.mx)b.push(o.mx+(o.mx===1?" Maximum":" Maximums"));
    if(b.length)hl.push(o.n+": "+b.join(", "))});
  if(hl.length)t+="\n\n🔥 Highlights:\n"+hl.map(function(x){return "• "+x}).join("\n");
  t+="\n\n#DCPhönix #Dart #BadischeDartLiga";return t}
function copyText(txt,btn){var done=function(){var o=btn.textContent;btn.textContent="Kopiert ✓";setTimeout(function(){btn.textContent=o},1800)};
  var fb=function(){var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){}document.body.removeChild(ta)};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,fb);else fb()}
function textBox(tx){var bx=el("div",null,"rtx"),hh=el("div",null,"rtxh");hh.appendChild(el("b","Berichtstext zum Teilen"));

function buildStats(){
  var own={},P={},hide=(CFG.verein.spieler_ausblenden||[]).map(norm),PAIRS={};
  CFG.teams.forEach(function(t){own[norm(t.name)]=t.name});
  function get(n,tn){var k=norm(n);if(hide.indexOf(k)>=0)return null;
    var p=P[k]||(P[k]={name:n,teams:{},ge:0,gd:0,ew:0,dw:0,hfc:0,slc:0,maxc:0,official:false,rew:0,rdw:0,rhf:0,rsl:0,rmx:0,log:[],pt:{},bestHF:0,bestSL:0,mp:0});
    p.teams[tn]=1;return p}
  DATA.teams.forEach(function(t){(t.players||[]).forEach(function(x){
    var tn=own[norm(x.team)];if(!tn)return;var p=get(x.name,tn);if(!p)return;
    p.official=true;p.ew=x.einzel||0;p.dw=x.doppel||0;p.hfc=x.hf||0;p.slc=x.sl||0;p.maxc=x.max||0})});
  function lev(a,b){var m=[],i,j;for(i=0;i<=a.length;i++)m[i]=[i];for(j=1;j<=b.length;j++)m[0][j]=j;
    for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
  var known=[];
  function matchName(n,tn){
    var t=norm(n).replace(/\s+/g," ").trim(),mine=known.filter(function(x){return x.team===tn});
    var ex=mine.filter(function(x){return x.ks.some(function(k){return t.indexOf(k)>=0})});
    if(ex.length)return ex;
    var best=null,bd=99;mine.forEach(function(x){var d=lev(t,x.ks[0]);if(d<bd){bd=d;best=x}});
    if(best&&bd<=2&&t.length>=8)return [best];
    var toks=t.split(/[ ,.]+/).filter(function(w){return w.length>=1}),long=toks.filter(function(w){return w.length>=3});
    var cand=mine.filter(function(x){var w=x.ks[0].split(" "),sur=w[w.length-1],tol=sur.length>=6?2:0;
      return long.some(function(tk){return tk===sur||(tol&&lev(tk,sur)<=tol)})});
    if(cand.length===1)return cand;
    if(cand.length>1){var ini=toks.map(function(w){return w[0]});
      var c2=cand.filter(function(x){return ini.indexOf(x.ks[0][0])>=0});
      if(c2.length===1)return c2}
    return []}
  var UN={};buildStats.unmatched=UN;
  DATA.teams.forEach(function(t){(t.players||[]).forEach(function(x){if(own[norm(x.team)]&&hide.indexOf(norm(x.name))<0){var k=norm(x.name).replace(/\s+/g," "),w=k.split(" "),alt=w.length>1?w[w.length-1]+", "+w.slice(0,-1).join(" "):k;known.push({ks:[k,alt],name:x.name,team:own[norm(x.team)]})}})});
  Object.keys(DATA.reports||{}).forEach(function(id){
    var r=DATA.reports[id],fx=FXI[id];
    [["heim","h"],["gast","g"]].forEach(function(s){
      var tn=own[norm(r[s[0]])];if(!tn)return;
      var oppTeam=s[0]==="heim"?r.gast:r.heim;
      (r.spiele||[]).forEach(function(g){
        var mine=s[0]==="heim"?g.ergebnis[0]:g.ergebnis[1],opp=s[0]==="heim"?g.ergebnis[1]:g.ergebnis[0],names=g[s[0]];
        var found=[];names.forEach(function(n){var m=matchName(n,tn);if(!m.length)UN[n]=(UN[n]||0)+1;m.forEach(function(x){if(found.indexOf(x)<0)found.push(x)})});
        var dbl=g.typ==="Doppel"||found.length>=2,list=found.length?found.map(function(x){return x.name}):names;
        list.forEach(function(n,i){
          var p=get(n,tn);if(!p)return;
          var partners=dbl?list.filter(function(x){return x!==n}):[];
          if(fx&&mine>opp&&(Date.now()-new Date(fx.datum).getTime())<=30*864e5)p.mp+=dbl?1:2;
          p.log.push({d:fx?fx.datum:"",opp:short(oppTeam),typ:dbl?"Doppel":"Einzel",won:mine>opp,sc:mine+":"+opp,partners:partners});
          if(dbl){p.gd++;if(mine>opp)p.rdw++;
            partners.forEach(function(q){var e=p.pt[q]||(p.pt[q]={g:0,w:0});e.g++;if(mine>opp)e.w++});
            if(i===0&&list.length===2){var key=list.slice().sort().join("|"),pe=PAIRS[key]||(PAIRS[key]={a:list[0],b:list[1],g:0,w:0});pe.g++;if(mine>opp)pe.w++}}
          else{p.ge++;if(mine>opp)p.rew++;
            if(names.length===1){var o1=g[s[1]]||{};(o1.hf||[]).forEach(function(x){if(x>p.bestHF)p.bestHF=x});(o1.sl||[]).forEach(function(x){if(!p.bestSL||x<p.bestSL)p.bestSL=x})}
            var v=list.length===names.length?pv(g[s[1]],i,names.length):{};if(v.hf!=null)p.rhf++;if(v.sl!=null)p.rsl++;if(v.max!=null)p.rmx+=(v.max<=20?v.max:1)}})})})});
  var comp={};
  DATA.teams.forEach(function(t){var played=(t.fixtures||[]).filter(function(f){return f.ergebnis});
    comp[t.name]=played.length>0&&played.every(function(f){return f.id&&DATA.reports&&DATA.reports[f.id]})});
  var out=Object.keys(P).map(function(k){var p=P[k];
    if(!p.official){p.ew=p.rew;p.dw=p.rdw;p.hfc=p.rhf;p.slc=p.rsl;p.maxc=p.rmx}
    p.w=p.ew+p.dw;p.pts=2*p.ew+p.dw;p.slug=slug(p.name);
    var cp=Object.keys(p.teams).every(function(t){return comp[t]});
    p.ke=cp&&p.ge>=p.ew;p.kd=cp&&p.gd>=p.dw;p.known=p.ke&&p.kd;
    p.g=p.known?p.ge+p.gd:0;p.q=p.known&&p.g?p.w/p.g:null;
    p.log.sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:0});return p});
  out.pairs=Object.keys(PAIRS).map(function(k){return PAIRS[k]});
  return out}

  m.appendChild(el("div",v.beschreibung||(v.name+" ist ein Dartverein aus "+(v.ort||"der Region")+" und spielt mit "+DATA.teams.length+" Teams in der Badischen Dart Liga."),"card lead"));
  /* Vorstand */
  var bd=el("div",null,"board");
  (v.vorstand||[]).forEach(function(p){var c=el("div",null,"bc");c.appendChild(avatar(p.name,photoUrl("vorstand",p.name,p.foto),"l"));c.appendChild(el("b",p.name));c.appendChild(el("span",p.rolle||"","rl"));bd.appendChild(c)});
  m.appendChild(sec("Vorstand",(v.vorstand&&v.vorstand.length)?bd:el("p","Der Vorstand wird noch eingetragen.","todo")));
  /* Infos */
  var c=el("div",null,"card"),dl=el("dl");
  function row(k,val,node){dl.appendChild(el("dt",k));var dd=el("dd");if(node)dd.appendChild(node);else if(val)dd.textContent=val;else dd.appendChild(el("span","folgt","todo"));dl.appendChild(dd)}
  row("Training",v.training);
  var sl=el("div");if(v.spiellokal){sl.appendChild(document.createTextNode(v.spiellokal));sl.appendChild(routeMenu(v.spiellokal))}
  row("Spiellokal",v.spiellokal,v.spiellokal?sl:null);
  var k=v.kontakt,kn=null;if(k){kn=el("span");if(/@/.test(k)&&!/\s/.test(k)){kn=el("a",k);kn.href="mailto:"+k}else if(/^[+\d][\d\s\/\-()]{5,}$/.test(k)){kn=el("a",k);kn.href="tel:"+k.replace(/[^\d+]/g,"")}else kn.textContent=k}
  row("Kontakt",k,kn);
  if(v.gegruendet)row("Gegründet",v.gegruendet);
  c.appendChild(dl);var tmc=trialMenu();if(tmc){var tw0=el("div");tw0.style.marginTop="16px";tw0.appendChild(tmc);c.appendChild(tw0)}
  var so=el("div",null,"social");so.style.marginTop="16px";socialButtons(so,true);if(so.children.length)c.appendChild(so);
  m.appendChild(sec("Infos & Kontakt",c));
  var tsv=termineSec();if(tsv)m.appendChild(tsv);
  /* Teams */
  var tg=el("div",null,"teams");
  DATA.teams.forEach(function(t){var a=el("a",null,"tc");a.href="#"+t.slug;var pu=photoUrl("team",t.slug),ph=el("div",null,"ph"+(pu?"":" none"));
    if(pu){var i=document.createElement("img");i.alt=t.name;i.loading="lazy";i.onerror=function(){i.remove();ph.className="ph none";ph.appendChild(el("b",initials(short(t.name))))};i.src=pu;ph.appendChild(i)}else ph.appendChild(el("b",initials(short(t.name))));
    a.appendChild(ph);var b=el("div",null,"bd");b.appendChild(el("h3",t.name));b.appendChild(el("div",t.liga_name,"lg"));a.appendChild(b);tg.appendChild(a)});
  m.appendChild(sec("Teams",tg));
  /* Galerie */
  var gl=PH.galerie||[];
  if(gl.length){var g=el("div",null,"gal");gl.forEach(function(n){var u="fotos/galerie/"+encodeURIComponent(n),b=el("button");b.type="button";b.setAttribute("aria-label","Foto vergrößern");
      var i=document.createElement("img");i.loading="lazy";i.alt="";i.onerror=function(){b.remove()};i.src=u;b.appendChild(i);b.onclick=function(){lightbox(u)};g.appendChild(b)});
    m.appendChild(sec("Galerie",g))}
  var sv=sponsorSec();if(sv)m.appendChild(sv);
  var tp=el("div",null,"card tip");
  [["iPhone (Safari)","Teilen-Symbol antippen, dann „Zum Home-Bildschirm“."],["Android (Chrome)","Menü ⋮ öffnen, dann „Zum Startbildschirm hinzufügen“."]].forEach(function(x){var d=el("div");d.appendChild(el("b",x[0]+": "));d.appendChild(document.createTextNode(x[1]));tp.appendChild(d)});
  m.appendChild(sec("Als App aufs Handy",tp))}
function lightbox(u){var o=el("div",null,"lb"),i=document.createElement("img");i.src=u;i.alt="";o.appendChild(i);
  function close(){o.remove();document.removeEventListener("keydown",key)}function key(e){if(e.key==="Escape")close()}
  o.onclick=close;document.addEventListener("keydown",key);document.body.appendChild(o)}

/* ---------- Routing ---------- */
function render(){
  var h=(location.hash||"#start").slice(1),m=$("main"),t=null;
  DATA.teams.forEach(function(x){if(x.slug===h)t=x});
  m.textContent="";$("heroBox").textContent="";
  var cur="start",ttl="";
  if(t){viewTeam(m,t);cur=t.slug;ttl=t.name+" · "}
  else if(h==="spieler"){viewPlayers(m);cur="spieler";ttl="Spieler · "}
  else if(h.indexOf("spieler-")===0){viewProfile(m,h.slice(8));cur="spieler";var p=stats().filter(function(x){return x.slug===h.slice(8)})[0];ttl=p?p.name+" · ":""}
  else if(h==="verein"){viewClub(m);cur="verein";ttl="Verein · "}
  else viewStart(m);
  Array.prototype.forEach.call($("tabs").children,function(a){if(a.getAttribute("href")==="#"+cur)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  document.title=ttl+CFG.verein.name}
function onHash(){render();window.scrollTo(0,0)}

function init(){
  var v=CFG.verein;
  DATA.teams.forEach(function(t,i){var c=CFG.teams[i]||{};t.slug=slug(c.slug||t.name.replace(/^dc ph(ö|oe)nix\s*/i,"")||t.name)||("team"+i);
    (t.fixtures||[]).forEach(function(f){if(f.id)FXI[f.id]=f})});
  $("bname").textContent=short(v.name).length<v.name.length?"DC Phönix":v.name;
  var bl=$("blogo");if(v.logo){bl.onload=function(){bl.hidden=false};bl.onerror=function(){bl.hidden=true};bl.src=v.logo}
  $("entwurf").hidden=!v.entwurf;
  var tabs=$("tabs");
  [["Start","start"]].concat(DATA.teams.map(function(t){return [short(t.name),t.slug]})).concat([["Spieler","spieler"],["Verein","verein"]]).forEach(function(p){var a=el("a",p[0]);a.href="#"+p[1];tabs.appendChild(a)});
  var lk=$("links");
  [["Impressum",v.impressum],["Datenschutz",v.datenschutz]].forEach(function(p){
    var u=safeUrl(p[1])||(p[1]&&/^[\w.\-\/]+$/.test(p[1])?p[1]:null);
    if(u){var a=el("a",p[0]);a.href=u;lk.appendChild(a)}else lk.appendChild(el("span",p[0]+" folgt"))});
  if(CFG.konto&&CFG.konto.supabase_url){var la=el("a","Spieler-Login");la.href="profil.html";lk.appendChild(la);accountBtn();window.addEventListener("pageshow",accountBtn)}
  socialButtons($("soc"));
  var u=DATA.updated?new Date(DATA.updated):null;
  $("upd").textContent=u&&!isNaN(u)?"Stand: "+u.toLocaleString("de-DE",{dateStyle:"medium",timeStyle:"short"}):"";
  document.addEventListener("click",function(e){document.querySelectorAll("details.menu[open]").forEach(function(d){if(!d.contains(e.target))d.open=false})});
  window.addEventListener("hashchange",onHash);render();liveProfiles()}

function liveProfiles(){
  var k=CFG&&CFG.konto;if(!k||!k.supabase_url||!k.anon_key)return;
  fetch(String(k.supabase_url).replace(/\/+$/,"")+"/rest/v1/rpc/oeffentliche_profile_live",{method:"POST",headers:{apikey:k.anon_key,"Content-Type":"application/json"},body:"{}",cache:"no-store",credentials:"omit",referrerPolicy:"no-referrer"})
  .then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(rows){
    var o={};rows.forEach(function(r){var n=r.spielername;delete r.spielername;var v={};for(var x in r)if(r[x]!==null&&r[x]!=="")v[x]=r[x];if(n&&Object.keys(v).length)o[n]=v});
    if(JSON.stringify(o)!==JSON.stringify(PROF)){PROF=o;ALL=null;render()}
  }).catch(function(){})
}
function accountBtn(){
  var box=$("acct"),k=CFG&&CFG.konto;if(!box||!k||!k.supabase_url){return}
  var ses=null;try{ses=JSON.parse(sessionStorage.getItem("dcp_session")||"null")}catch(e){}
  box.textContent="";box.hidden=false;
  if(ses&&ses.access_token){
    var p=el("a","Profil");p.href="profil.html";box.appendChild(p);
    var b=el("button","Abmelden");b.type="button";
    b.onclick=function(){
      try{sessionStorage.removeItem("dcp_session")}catch(e){}
      try{fetch(String(k.supabase_url).replace(/\/+$/,"")+"/auth/v1/logout",{method:"POST",headers:{apikey:k.anon_key,Authorization:"Bearer "+ses.access_token},credentials:"omit",referrerPolicy:"no-referrer"}).catch(function(){})}catch(e){}
      accountBtn()};
    box.appendChild(b);
  }else{var a=el("a","Anmelden","pri");a.href="profil.html";box.appendChild(a)}
}
Promise.all([getJSON("config.json"),getJSON("data.json"),getJSON("fotos/index.json").catch(function(){return {}}),getJSON("profile.json").catch(function(){return {}})]).then(function(r){CFG=r[0];DATA=r[1];PH=r[2]||{};PROF=r[3]||{};
  if(!DATA.teams||!DATA.teams.length)throw new Error("keine Teams");init()})
.catch(function(e){$("main").textContent="Daten konnten nicht geladen werden.";$("main").className="wrap err";console.error(e)});
})();
</script>
