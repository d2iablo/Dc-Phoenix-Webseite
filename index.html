<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DC Phönix Durmersheim</title>
<link rel="icon" href="logo.png">
<style>
:root{--bg:#0B0907;--bg2:#14100C;--card:rgba(255,255,255,.055);--card-solid:#18130F;--line:rgba(255,255,255,.11);--fg:#F6EFE0;--mute:#A99F8C;--a1:#FF7A2F;--a2:#FFC25A;--a-fg:#1A0F05;--own:rgba(255,138,61,.16);--win:#6CD08A;--loss:#FF7B63;--warn-bg:#2B2410;--warn-fg:#F3DE8A;--logo-filter:invert(1) grayscale(1);--logo-blend:screen;--logo-op:.3;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F7F1E4;--bg2:#EFE6D2;--card:rgba(255,255,255,.75);--card-solid:#fff;--line:rgba(30,20,10,.12);--fg:#19130D;--mute:#6E6350;--a1:#E2541A;--a2:#F09A2A;--a-fg:#fff;--own:rgba(226,84,26,.12);--win:#2A7A45;--loss:#B63A27;--warn-bg:#FFE9A8;--warn-fg:#5A4500;--logo-filter:none;--logo-blend:multiply;--logo-op:.22;color-scheme:light}}
:root[data-theme="light"]{--bg:#F7F1E4;--bg2:#EFE6D2;--card:rgba(255,255,255,.75);--card-solid:#fff;--line:rgba(30,20,10,.12);--fg:#19130D;--mute:#6E6350;--a1:#E2541A;--a2:#F09A2A;--a-fg:#fff;--own:rgba(226,84,26,.12);--win:#2A7A45;--loss:#B63A27;--warn-bg:#FFE9A8;--warn-fg:#5A4500;--logo-filter:none;--logo-blend:multiply;--logo-op:.22;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:900px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.grad{background:linear-gradient(95deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

.banner{background:var(--warn-bg);color:var(--warn-fg);font-size:.85rem;padding-block:8px;padding-top:calc(8px + env(safe-area-inset-top,0px))}

/* Hero mit Logo im Hintergrund */
.hero{position:relative;overflow:hidden;isolation:isolate;padding-block:46px 54px;background:
 radial-gradient(70% 90% at 85% 10%,color-mix(in srgb,var(--a1) 28%,transparent),transparent 70%),
 radial-gradient(60% 70% at 0% 100%,color-mix(in srgb,var(--a2) 14%,transparent),transparent 70%),var(--bg)}
.hero .logo{position:absolute;z-index:-1;right:-18%;top:50%;width:min(125vw,760px);aspect-ratio:1;object-fit:cover;transform:translateY(-50%);
 filter:var(--logo-filter);mix-blend-mode:var(--logo-blend);opacity:var(--logo-op);
 -webkit-mask-image:radial-gradient(closest-side,#000 35%,transparent 100%);mask-image:radial-gradient(closest-side,#000 35%,transparent 100%)}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-weight:600}
.eyebrow::before{content:"";width:28px;height:2px;background:linear-gradient(90deg,var(--a1),var(--a2));border-radius:2px}
.hero h1{font-size:clamp(2.6rem,12vw,5.2rem);line-height:.95;font-weight:900;letter-spacing:-.035em;text-transform:uppercase;margin-top:14px;max-width:11ch}
.hero h1 span{display:block}
.hero .sub{margin:16px 0 0;max-width:34ch;color:var(--mute);font-size:1.05rem}
.chip{display:inline-flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:24px;padding:10px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:.92rem;text-decoration:none}
.chip b{font-weight:800}
.chip .go{color:var(--a2);font-weight:700}

/* Navigation */
.nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.tabs{display:flex;gap:6px;padding-block:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;text-decoration:none;font-weight:700;font-size:.92rem;padding:8px 16px;border-radius:999px;color:var(--mute);border:1px solid transparent}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-current="page"]{color:var(--a-fg);background:linear-gradient(95deg,var(--a1),var(--a2))}

main{padding-block:30px 48px}
#vStart,#vTeam{display:grid;gap:34px}
section{min-width:0}
h2{font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.lead p{margin:0;font-size:1.15rem;line-height:1.5}

.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media (min-width:640px){.facts{grid-template-columns:repeat(3,1fr)}}
.fact{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.fact small{display:block;color:var(--mute);text-transform:uppercase;letter-spacing:.14em;font-size:.68rem;font-weight:600}
.fact b{display:block;font-size:1.1rem;margin-top:4px;overflow-wrap:anywhere;font-weight:800}

.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.tc{position:relative;display:block;text-decoration:none;border-radius:22px;padding:20px;border:1px solid var(--line);background:linear-gradient(160deg,var(--card),transparent);overflow:hidden}
.tc::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--a1),var(--a2))}
.tc h3{font-size:1.4rem;font-weight:900;letter-spacing:-.02em;text-transform:uppercase}
.tc span{display:block;color:var(--mute);font-size:.92rem}
.tc .rk{margin-top:12px;font-size:.95rem;font-weight:700}
.tc .go{margin-top:12px;color:var(--a2);font-weight:800}

/* Spielkarten */
.fix{display:grid;gap:10px;padding:0;margin:0;list-style:none}
.fix li{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px 12px 12px}
.fix li.two{grid-template-columns:auto 1fr}
.fix li.past{opacity:.8}
.dt{width:58px;text-align:center;border-radius:14px;padding:8px 0;background:var(--bg2);border:1px solid var(--line);line-height:1}
.dt i{display:block;font-style:normal;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}
.dt b{display:block;font-size:1.65rem;font-weight:900;margin:4px 0 2px;letter-spacing:-.03em}
.dt small{display:block;font-size:.66rem;color:var(--a2);font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.fix .m{min-width:0;overflow-wrap:anywhere}
.fix .m>b{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--a2);margin-bottom:2px}
.fix .r{font-size:1.35rem;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-align:right}
.fix .r.w{color:var(--win)}.fix .r.l{color:var(--loss)}.fix .r.n{color:var(--mute);font-weight:500}
.dd2{color:var(--a2);font-weight:800;margin-top:2px}
.pill{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 9px;border-radius:999px;margin-right:8px;vertical-align:1px;line-height:1.5}
.pill.h{background:linear-gradient(95deg,var(--a1),var(--a2));color:var(--a-fg)}
.pill.g{border:1.5px solid var(--a2);color:var(--a2)}
.ven{font-size:.88rem;margin-top:4px;color:var(--mute)}
.ven a{text-decoration-color:color-mix(in srgb,var(--fg) 35%,transparent);text-underline-offset:3px}

/* Team-Seite */
.teamhead h1{font-size:clamp(2rem,9vw,3.6rem);font-weight:900;letter-spacing:-.03em;text-transform:uppercase;line-height:1}
.teamhead p{margin:10px 0 0;color:var(--mute)}
.teamhead .stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stat{padding:10px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.stat b{display:block;font-size:1.5rem;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.stat small{color:var(--mute);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600}

.next .card{position:relative;padding:22px;border:0;background:linear-gradient(var(--card-solid),var(--card-solid)) padding-box,linear-gradient(135deg,var(--a1),var(--a2)) border-box;border:2px solid transparent;display:grid;grid-template-columns:1fr auto;gap:8px 18px;align-items:center}
.next .lbl{grid-column:1/-1;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-weight:700}
.next .vs{font-size:clamp(1.35rem,6vw,1.9rem);font-weight:900;line-height:1.1;letter-spacing:-.02em;text-transform:uppercase;overflow-wrap:anywhere}
.next .info{grid-column:1/-1;color:var(--mute)}
.next .big{grid-row:2;grid-column:2;text-align:center;padding:10px 16px;border-radius:18px;background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--a-fg);line-height:1}
.next .big b{display:block;font-size:2.4rem;font-weight:900;letter-spacing:-.04em}
.next .big small{display:block;font-size:.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.next .card.plain{display:block}

.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:20px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:11px 10px;text-align:right;white-space:nowrap}
th{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{padding-left:16px;text-align:center;width:44px;color:var(--mute);font-weight:700}
th:nth-child(2),td:nth-child(2){text-align:left;white-space:normal;min-width:0}
th:last-child,td:last-child{padding-right:16px}
td:last-child{font-weight:900;font-size:1.05rem}
tr.own td{background:var(--own);font-weight:800}
tr.own td:first-child{box-shadow:inset 4px 0 0 var(--a1);color:var(--a2)}
caption{padding:16px;color:var(--mute);text-align:left}
@media (max-width:640px){.hide-s{display:none}}

dl{display:grid;grid-template-columns:max-content 1fr;gap:12px 18px;margin:0}
dt{color:var(--mute);text-transform:uppercase;letter-spacing:.12em;font-size:.7rem;font-weight:700;padding-top:4px}
dd{margin:0;overflow-wrap:anywhere}
.card p{margin:0 0 14px}
.todo{color:var(--mute);font-style:italic}
a:focus-visible,button:focus-visible{outline:2px solid var(--a2);outline-offset:2px}

footer{border-top:1px solid var(--line);padding-block:18px calc(28px + env(safe-area-inset-bottom,0px));color:var(--mute);font-size:.82rem;display:flex;flex-wrap:wrap;gap:6px 18px}
#links{display:flex;gap:16px;flex-wrap:wrap}
.err{color:var(--loss)}
@media (prefers-reduced-motion:no-preference){.tc,.chip{transition:transform .2s,border-color .2s}.tc:hover,.chip:hover{transform:translateY(-3px);border-color:var(--a2)}}
</style>
</head>
<body>
<div class="banner" id="entwurf" hidden><div class="wrap">Entwurf eines Vereinsmitglieds, noch nicht vom Verein freigegeben.</div></div>

<header class="hero">
<img class="logo" id="logo" alt="" hidden>
<div class="wrap">
<div class="eyebrow" id="vsub">Dart</div>
<h1 id="vname">DC Phönix Durmersheim</h1>
<p class="sub" id="vtag">Dartverein in der Badischen Dart Liga</p>
<a class="chip" id="heroNext" href="#start" hidden></a>
</div>
</header>

<nav class="nav" aria-label="Bereiche"><div class="wrap tabs" id="tabs"></div></nav>

<main class="wrap">
<div id="vStart" hidden>
<section><div class="card lead"><p id="beschr"></p></div></section>
<section><h2>Auf einen Blick</h2><div class="facts" id="facts"></div></section>
<section><h2>Unsere Teams</h2><div class="teams" id="teamCards"></div></section>
<section><h2>Nächste Spiele</h2><ul class="fix" id="nextAll"></ul></section>
<section><h2>Vorstand</h2><div class="card"><dl id="vorstand"></dl></div></section>
<section><h2>Mitmachen</h2><div class="card"><p id="willkommen"></p><dl id="info"></dl></div></section>
</div>

<div id="vTeam" hidden>
<section class="teamhead"><h1 id="tName"></h1><p id="tLiga"></p><div class="stats" id="tStats"></div></section>
<section class="next" aria-live="polite"><h2>Nächstes Spiel</h2><div class="card" id="next">Lade …</div></section>
<section><h2>Spielplan</h2><ul class="fix" id="fix"></ul></section>
<section><h2>Tabelle</h2><div class="scroll"><table id="tbl"></table></div></section>
</div>
</main>

<footer class="wrap"><span id="upd"></span><span id="links"></span></footer>

<script>
(function(){
"use strict";
var CFG=null,DATA=null;
var $=function(id){return document.getElementById(id)};
function el(tag,txt,cls){var e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e}
function norm(s){return String(s||"").trim().toLowerCase()}
function slug(s){return norm(s).replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function parts(iso){var p=iso.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);
  return {w:d.toLocaleDateString("de-DE",{weekday:"short"}).replace(".",""),day:String(+p[2]),mon:d.toLocaleDateString("de-DE",{month:"short"}).replace(".",""),full:d.toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"long",year:"numeric"})}}
function when(f){var p=f.datum.split("-"),t=(f.zeit||"20:00").split(":");return new Date(+p[0],+p[1]-1,+p[2],+t[0]||20,+t[1]||0)}
function safeUrl(u){return /^https?:\/\//i.test(u||"")?u:null}
function getJSON(u){return fetch(u,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(u+" "+r.status);return r.json()})}
function nextOf(t){var now=Date.now(),fx=(t.fixtures||[]).slice().sort(function(a,b){return a.datum<b.datum?-1:1}),n=null;
  fx.forEach(function(f){if(!n&&!f.ergebnis&&when(f).getTime()+4*3600e3>now)n=f});return n}
function daysTo(f){var now=new Date(),p=f.datum.split("-");
  return Math.round((new Date(+p[0],+p[1]-1,+p[2])-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5)}
function dayTxt(d){return d<=0?"Heute!":d===1?"Morgen":"In "+d+" Tagen"}
function rank(t){return (t.table||[]).filter(function(x){return norm(x.team)===norm(t.name)})[0]||null}
function pill(f,t){var h=norm(f.heim)===norm(t.name),a=!h&&norm(f.gast)===norm(t.name);
  if(!f.heim||!(h||a))return null;return el("span",h?"Heim":"Gast","pill "+(h?"h":"g"))}
function venue(f){if(!f.heim)return "";var k=norm(f.heim),sp=CFG.spielorte||{},a="";
  for(var n in sp)if(norm(n)===k)a=sp[n];
  if(!a&&CFG.teams.some(function(c){return norm(c.name)===k}))a=CFG.verein.spiellokal||"";return a}
function venueEl(f){if(!f.heim)return null;var a=venue(f),d=el("div",null,"ven");d.appendChild(document.createTextNode("Spielort: "));
  if(a){var l=el("a",a);l.href="https://www.openstreetmap.org/search?query="+encodeURIComponent(a);l.target="_blank";l.rel="noopener";d.appendChild(l)}
  else d.appendChild(el("span","Adresse folgt","todo"));return d}
function vsText(f){return f.heim?f.heim+" – "+f.gast:"Gegner folgt"}
function dateBox(f){var p=parts(f.datum),d=el("div",null,"dt");d.appendChild(el("i",p.w));d.appendChild(el("b",p.day));d.appendChild(el("small",p.mon));return d}
function fillRow(dl,k,val,link){dl.appendChild(el("dt",k));var dd=el("dd");
  if(val){var u=link&&safeUrl(val);if(u){var a=el("a",val);a.href=u;a.target="_blank";a.rel="noopener";dd.appendChild(a)}else dd.textContent=val}
  else dd.appendChild(el("span","folgt","todo"));dl.appendChild(dd)}
function vsLine(f,t){var vl=el("div",vsText(f)),p=pill(f,t);if(p)vl.insertBefore(p,vl.firstChild);return vl}

function renderTeam(t){
  var own=norm(t.name);
  $("tName").textContent=t.name;
  $("tLiga").textContent=t.liga_name+" · Badische Dart Liga";
  var st=$("tStats");st.textContent="";
  var r=rank(t);
  if(r){[["Platz",r.platz+"."],["Punkte",r.punkte],["Spiele",r.spiele]].forEach(function(x){var d=el("div",null,"stat");d.appendChild(el("b",x[1]));d.appendChild(el("small",x[0]));st.appendChild(d)})}
  var fx=(t.fixtures||[]).slice().sort(function(a,b){return a.datum<b.datum?-1:1});
  var next=nextOf(t),n=$("next");n.textContent="";n.className="card";
  if(next){
    n.appendChild(el("div",(next.spieltag?next.spieltag+". Spieltag · ":"")+parts(next.datum).full,"lbl"));
    var vsd=el("div",vsText(next),"vs"),pp=pill(next,t);if(pp)vsd.insertBefore(pp,vsd.firstChild);n.appendChild(vsd);
    var dd=daysTo(next),big=el("div",null,"big");
    big.appendChild(el("b",dd<=0?"Heute":dd===1?"1":String(dd)));big.appendChild(el("small",dd<=0?"Spieltag":dd===1?"Tag":"Tage"));n.appendChild(big);
    var inf=el("div",next.heim?(next.zeit||"20:00")+" Uhr":"Uhrzeit folgt","info");
    var ve=venueEl(next);if(ve)inf.appendChild(ve);n.appendChild(inf);
  }else{n.className="card plain";n.textContent="Aktuell ist kein Spiel angesetzt."}
  var ul=$("fix");ul.textContent="";
  if(!fx.length)ul.appendChild(el("li","Der Spielplan folgt."));
  fx.forEach(function(f){
    var li=document.createElement("li"),rr=el("div","","r n");
    if(f.ergebnis){rr.textContent=f.ergebnis[0]+" : "+f.ergebnis[1];
      var home=norm(f.heim)===own,mine=home?f.ergebnis[0]:f.ergebnis[1],opp=home?f.ergebnis[1]:f.ergebnis[0];
      rr.className="r "+(mine>opp?"w":mine<opp?"l":"n");li.className="past"}
    else rr.textContent=f.heim?(f.zeit||"20:00"):"";
    var mm=el("div",null,"m");mm.appendChild(vsLine(f,t));var v2=venueEl(f);if(v2)mm.appendChild(v2);
    li.appendChild(dateBox(f));li.appendChild(mm);li.appendChild(rr);ul.appendChild(li)});
  var tb=$("tbl");tb.textContent="";
  if(!(t.table||[]).length){tb.appendChild(el("caption","Die Tabelle folgt."));return}
  var th=document.createElement("thead"),hr=document.createElement("tr");
  [["#",""],["Team",""],["Sp",""],["G","hide-s"],["U","hide-s"],["V","hide-s"],["Sets","hide-s"],["Legs","hide-s"],["Pkt",""]].forEach(function(c){hr.appendChild(el("th",c[0],c[1]))});
  th.appendChild(hr);tb.appendChild(th);
  var tbd=document.createElement("tbody");
  t.table.forEach(function(x){
    var tr=document.createElement("tr");if(norm(x.team)===own)tr.className="own";
    [[x.platz,""],[x.team,""],[x.spiele,""],[x.g,"hide-s"],[x.u,"hide-s"],[x.v,"hide-s"],[x.sets,"hide-s"],[x.legs,"hide-s"],[x.punkte,""]].forEach(function(c){tr.appendChild(el("td",c[0],c[1]))});
    tbd.appendChild(tr)});
  tb.appendChild(tbd)}

function renderStart(){
  var v=CFG.verein;
  $("beschr").textContent=v.beschreibung||(v.name+" ist ein Dartverein aus "+(v.ort||"der Region")+" und spielt mit "+DATA.teams.length+" Teams in der Badischen Dart Liga.");
  var f=$("facts");f.textContent="";
  [["Verein",v.name],["Ort",v.ort],["Gegründet",v.gegruendet],["Teams",String(DATA.teams.length)],["Training",v.training],["Spieltag","freitags, 20 Uhr"]].forEach(function(p){
    var d=el("div",null,"fact");d.appendChild(el("small",p[0]));d.appendChild(el("b",p[1]||"folgt"));f.appendChild(d)});
  var tc=$("teamCards");tc.textContent="";
  DATA.teams.forEach(function(t){
    var a=el("a",null,"tc");a.href="#"+t.slug;
    a.appendChild(el("h3",t.name));a.appendChild(el("span",t.liga_name));
    var r=rank(t);a.appendChild(el("div",r?"Platz "+r.platz+" · "+r.punkte+" Punkte":"Tabelle folgt","rk"));
    a.appendChild(el("div","Zum Team →","go"));tc.appendChild(a)});
  var na=$("nextAll");na.textContent="";
  var all=[];
  DATA.teams.forEach(function(t){var n=nextOf(t);if(n)all.push({t:t,n:n})});
  all.sort(function(a,b){return a.n.datum<b.n.datum?-1:1});
  all.forEach(function(x){
    var li=document.createElement("li");li.className="two";
    var m=el("div",null,"m");m.appendChild(el("b",x.t.name));m.appendChild(vsLine(x.n,x.t));
    var ve=venueEl(x.n);if(ve)m.appendChild(ve);
    m.appendChild(el("div",dayTxt(daysTo(x.n))+(x.n.heim?" · "+(x.n.zeit||"20:00")+" Uhr":""),"dd2"));
    li.appendChild(dateBox(x.n));li.appendChild(m);na.appendChild(li)});
  if(!all.length)na.appendChild(el("li","Aktuell sind keine Spiele angesetzt."));
  var hn=$("heroNext");
  if(all.length){var x=all[0],p=parts(x.n.datum);hn.hidden=false;hn.textContent="";hn.href="#"+x.t.slug;
    hn.appendChild(el("span","Nächstes Spiel"));hn.appendChild(el("b",p.w+", "+p.day+". "+p.mon+" · "+x.t.name.replace(/^DC Phönix\s*/i,"")));hn.appendChild(el("span","Mehr →","go"))}
  else hn.hidden=true;
  var vs=$("vorstand");vs.textContent="";
  if(v.vorstand&&v.vorstand.length)v.vorstand.forEach(function(p){fillRow(vs,p.rolle,p.name)});
  else vs.appendChild(el("span","Der Vorstand wird noch eingetragen.","todo"));
  $("willkommen").textContent=v.willkommen||"Interesse am Dartspielen? Schau beim Training vorbei oder melde dich über die Kontaktdaten.";
  var dl=$("info");dl.textContent="";
  fillRow(dl,"Training",v.training);fillRow(dl,"Spiellokal",v.spiellokal);fillRow(dl,"Kontakt",v.kontakt);
  fillRow(dl,"Instagram",v.instagram,true);fillRow(dl,"Facebook",v.facebook,true)}

function route(){
  var h=(location.hash||"#start").slice(1),t=null;
  DATA.teams.forEach(function(x){if(x.slug===h)t=x});
  $("vStart").hidden=!!t;$("vTeam").hidden=!t;$("heroNext").hidden=!!t||$("heroNext").hidden;
  if(t)renderTeam(t);else renderStart();
  Array.prototype.forEach.call($("tabs").children,function(a){
    if(a.getAttribute("href")==="#"+(t?t.slug:"start"))a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  document.title=(t?t.name+" · ":"")+CFG.verein.name;
  var nv=document.querySelector(".nav");if(window.scrollY>nv.offsetTop)window.scrollTo(0,nv.offsetTop)}

function init(){
  var v=CFG.verein;
  DATA.teams.forEach(function(t,i){var c=CFG.teams[i]||{};t.slug=slug(c.slug||t.name.replace(/^dc ph(ö|oe)nix\s*/i,"")||t.name)||("team"+i)});
  var words=v.name.split(" "),h=$("vname");h.textContent="";
  words.forEach(function(w,i){var s=el("span",w);if(/^ph(ö|oe)nix$/i.test(w))s.className="grad";h.appendChild(s)});
  $("vsub").textContent="Dart"+(v.ort?" · "+v.ort:"");
  $("vtag").textContent="Dartverein in der Badischen Dart Liga";
  $("entwurf").hidden=!v.entwurf;
  var lg=$("logo");if(v.logo){lg.onload=function(){lg.hidden=false};lg.onerror=function(){lg.hidden=true};lg.src=v.logo}
  var tabs=$("tabs");
  [["Start","start"]].concat(DATA.teams.map(function(t){return [t.name.replace(/^DC Phönix\s*/i,"")||t.name,t.slug]})).forEach(function(p){
    var a=el("a",p[0]);a.href="#"+p[1];tabs.appendChild(a)});
  var lk=$("links");
  [["Impressum",v.impressum],["Datenschutz",v.datenschutz]].forEach(function(p){
    var u=safeUrl(p[1])||(p[1]&&/^[\w.\-\/]+$/.test(p[1])?p[1]:null);
    if(u){var a=el("a",p[0]);a.href=u;lk.appendChild(a)}else lk.appendChild(el("span",p[0]+" folgt"))});
  var u=DATA.updated?new Date(DATA.updated):null;
  $("upd").textContent=u&&!isNaN(u)?"Stand: "+u.toLocaleString("de-DE",{dateStyle:"medium",timeStyle:"short"}):"";
  window.addEventListener("hashchange",route);route()}

Promise.all([getJSON("config.json"),getJSON("data.json")]).then(function(r){CFG=r[0];DATA=r[1];
  if(!DATA.teams||!DATA.teams.length)throw new Error("keine Teams");init()})
.catch(function(e){var m=document.querySelector("main");m.textContent="Daten konnten nicht geladen werden.";m.className="wrap err";console.error(e)});
})();
</script>
</body>
</html>
