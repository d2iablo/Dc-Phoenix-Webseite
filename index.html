<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DC Phönix Durmersheim</title>
<style>
:root{--bg:#F4EBD6;--card:#FBF6E9;--fg:#17120E;--mute:#6B5F4C;--line:#D8CBAE;--navy:#15110D;--flame:#8F5F26;--flame-fg:#fff;--green:#3C3731;--own:#EBD9B4;--win:#2F6B3F;--loss:#A33B2A;--warn:#FFE9A8;--warn-fg:#5A4500;--board:#1B1611;--board-fg:#F4EBD6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#100D0A;--card:#1C1814;--fg:#F4EBD6;--mute:#B0A48C;--line:#2F2820;--navy:#0A0806;--flame:#C9954F;--flame-fg:#15110D;--green:#CFC3A8;--own:#3A2D1B;--win:#6CC184;--loss:#F0745F;--warn:#3B3210;--warn-fg:#F3DE8A;--board:#0E0B08;--board-fg:#F4EBD6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#100D0A;--card:#1C1814;--fg:#F4EBD6;--mute:#B0A48C;--line:#2F2820;--navy:#0A0806;--flame:#C9954F;--flame-fg:#15110D;--green:#CFC3A8;--own:#3A2D1B;--win:#6CC184;--loss:#F0745F;--warn:#3B3210;--warn-fg:#F3DE8A;--board:#0E0B08;--board-fg:#F4EBD6;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
h1,h2,h3{font-family:Impact,"Arial Narrow","Helvetica Neue Condensed",system-ui,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.05em;margin:0;text-wrap:balance}
a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:relative;overflow:hidden;background:var(--navy) radial-gradient(circle at 12% 30%,rgba(201,149,79,.18),transparent 55%);color:#F2E6C9;padding-block:calc(26px + env(safe-area-inset-top,0px)) 34px;border-bottom:6px solid var(--flame);box-shadow:0 6px 0 var(--green)}
.board{position:absolute;right:-70px;top:50%;width:300px;height:300px;transform:translateY(-50%) rotate(12deg);opacity:.95}
.hero{position:relative}
.brand{display:flex;align-items:center;gap:16px;min-width:0;max-width:calc(100% - 90px)}
.brand img{height:76px;width:76px;object-fit:cover;border-radius:50%;border:3px solid #F2E6C9;flex:none}
.brand h1{font-size:clamp(1.9rem,8vw,3.2rem);line-height:1;text-shadow:2px 2px 0 var(--flame)}
.brand small{display:block;color:#E2D5B3;letter-spacing:.18em;text-transform:uppercase;font-size:.75rem;margin-top:8px}
.banner{background:var(--warn);color:var(--warn-fg);padding-block:10px;font-size:.9rem}
main{padding-block:26px 40px;display:grid;gap:30px}
section{min-width:0}
h2{font-size:1.5rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:22px;height:22px;flex:none;border-radius:50%;background:radial-gradient(circle,var(--flame) 0 22%,var(--green) 23% 45%,var(--fg) 46% 60%,var(--card) 61% 100%);border:2px solid var(--fg)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:700;padding:9px 16px;border-radius:999px;border:2px solid var(--fg);background:var(--card);color:var(--fg);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--flame);border-color:var(--flame);color:var(--flame-fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.next .card{background:var(--board);color:var(--board-fg);border:3px solid #7A6240;border-radius:14px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06);padding:20px}
.next .lbl{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.next .vs{font-family:Impact,"Arial Narrow",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.03em;font-size:clamp(1.4rem,6vw,2rem);line-height:1.15;margin:8px 0;overflow-wrap:anywhere}
.next .cd{display:inline-block;margin-top:10px;background:var(--flame);color:var(--flame-fg);font-family:Impact,"Arial Narrow",system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;font-size:1.2rem;padding:4px 14px;border-radius:6px}
.next .card.err{color:var(--loss)}
.fix{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.fix li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--green);border-radius:10px;padding:10px 12px}
.fix li.past{border-left-color:var(--line)}
.fix .d{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.fix .d small{display:block;font-weight:400;color:var(--mute)}
.fix .m{min-width:0;overflow-wrap:anywhere}
.fix .r{font-family:Impact,"Arial Narrow",system-ui,sans-serif;font-size:1.2rem;letter-spacing:.04em;font-variant-numeric:tabular-nums;text-align:right}
.fix .r.w{color:var(--win)}.fix .r.l{color:var(--loss)}.fix .r.n{color:var(--mute)}
.scroll{overflow-x:auto;border:2px solid var(--fg);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;background:var(--navy);color:#F2E6C9;border-bottom:0}
th:nth-child(2),td:nth-child(2){text-align:left;white-space:normal;min-width:0}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(1) td:first-child{box-shadow:inset 4px 0 0 var(--green)}
tr.own td{background:var(--own);font-weight:700}
td:last-child{font-family:Impact,"Arial Narrow",system-ui,sans-serif;font-size:1.1rem;font-weight:400}
@media (max-width:640px){.hide-s{display:none}.board{width:230px;height:230px;right:-90px;opacity:.3}}
dl{display:grid;grid-template-columns:max-content 1fr;gap:10px 16px;margin:0}
dt{color:var(--mute);text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;padding-top:3px}dd{margin:0;overflow-wrap:anywhere}
.todo{color:var(--mute);font-style:italic}
footer{border-top:1px solid var(--line);padding-block:16px calc(24px + env(safe-area-inset-bottom,0px));color:var(--mute);font-size:.85rem;display:flex;flex-wrap:wrap;gap:6px 18px}
.err{color:var(--loss)}

.lead p{margin:0;font-size:1.1rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.fact{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--flame);border-radius:10px;padding:12px}
.fact small{display:block;color:var(--mute);text-transform:uppercase;letter-spacing:.1em;font-size:.72rem}
.fact b{display:block;font-size:1.05rem;margin-top:2px;overflow-wrap:anywhere}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tc{display:block;text-decoration:none;background:var(--card);border:2px solid var(--fg);border-radius:12px;padding:14px;color:var(--fg)}
.tc:hover,.tc:focus-visible{border-color:var(--flame)}
.tc h3{font-size:1.3rem;margin-bottom:4px}
.tc span{color:var(--mute);font-size:.9rem;display:block}
.tc .go{color:var(--flame);font-weight:700;margin-top:8px}
.teamhead h2{font-size:1.9rem}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;margin-top:-10px}
.tabs a{font:inherit;font-weight:700;padding:9px 16px;border-radius:999px;border:2px solid var(--fg);background:var(--card);color:var(--fg);text-decoration:none}
.tabs a[aria-current="page"]{background:var(--flame);border-color:var(--flame);color:var(--flame-fg)}
#vStart,#vTeam{display:grid;gap:30px}
.fix li.two{grid-template-columns:auto 1fr}
.dd2{color:var(--flame);font-weight:700}
.teamhead h2::before{display:none}
.pill{display:inline-block;font-family:Arial,system-ui,sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:1px 8px;border-radius:999px;margin-right:8px;vertical-align:middle;line-height:1.5}
.pill.h{background:var(--green);color:var(--card)}
.pill.g{background:transparent;color:var(--flame);border:1.5px solid var(--flame)}
.ven{font-size:.9rem;margin-top:4px;color:var(--mute)}
.next .ven{color:var(--board-fg);opacity:.85}
#links{display:flex;gap:16px;flex-wrap:wrap}
</style>
</head>
<body>
<header><svg class="board" viewBox="-100 -100 200 200" aria-hidden="true"><circle r="100" fill="#15110D"/><circle r="86" fill="none" stroke="#B08A55" stroke-width="10"/><circle r="86" fill="none" stroke="#5E5445" stroke-width="10" stroke-dasharray="27.02 27.02" transform="rotate(-9)"/><circle r="70" fill="none" stroke="#E9DDBF" stroke-width="22"/><circle r="70" fill="none" stroke="#15110D" stroke-width="22" stroke-dasharray="21.99 21.99" transform="rotate(-9)"/><circle r="54" fill="none" stroke="#B08A55" stroke-width="9"/><circle r="54" fill="none" stroke="#5E5445" stroke-width="9" stroke-dasharray="16.96 16.96" transform="rotate(-9)"/><circle r="40" fill="none" stroke="#15110D" stroke-width="20"/><circle r="40" fill="none" stroke="#E9DDBF" stroke-width="20" stroke-dasharray="12.57 12.57" transform="rotate(-9)"/><circle r="14" fill="#5E5445"/><circle r="6" fill="#B08A55"/></svg><div class="wrap hero"><div class="brand">
<img id="logo" alt="Vereinslogo" hidden>
<div><h1 id="vname">DC Phönix Durmersheim</h1><small id="vsub">Dart</small></div>
</div></div></header>
<div class="banner" id="entwurf" hidden><div class="wrap">Entwurf eines Vereinsmitglieds, noch nicht vom Verein freigegeben.</div></div>

<main class="wrap">
<nav class="tabs" id="tabs" aria-label="Bereiche"></nav>

<div id="vStart" hidden>
<section><div class="card lead"><p id="beschr"></p></div></section>
<section><h2>Auf einen Blick</h2><div class="facts" id="facts"></div></section>
<section><h2>Unsere Teams</h2><div class="teams" id="teamCards"></div></section>
<section><h2>Nächste Spiele</h2><ul class="fix" id="nextAll"></ul></section>
<section><h2>Vorstand</h2><div class="card"><dl id="vorstand"></dl></div></section>
<section><h2>Mitmachen</h2><div class="card"><p id="willkommen"></p><dl id="info"></dl></div></section>
</div>

<div id="vTeam" hidden>
<section><div class="teamhead"><h2 id="tName"></h2><p class="todo" id="tLiga"></p></div></section>
<section class="next" aria-live="polite"><h2>Nächstes Spiel</h2><div class="card" id="next">Lade …</div></section>
<section><h2>Spielplan</h2><ul class="fix" id="fix"></ul></section>
<section><h2>Tabelle</h2><div class="scroll"><table id="tbl"></table></div></section>
</div>
</main>

<footer class="wrap"><span id="upd"></span><span id="links"></span></footer>

<script>
(function(){
"use strict";
var CFG=null,DATA=null,views=[];
var $=function(id){return document.getElementById(id)};
function el(tag,txt,cls){var e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e}
function norm(s){return String(s||"").trim().toLowerCase()}
function slug(s){return norm(s).replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function fmtDate(iso){var p=iso.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);
  return d.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"})}
function when(f){var p=f.datum.split("-"),t=(f.zeit||"20:00").split(":");
  return new Date(+p[0],+p[1]-1,+p[2],+t[0]||20,+t[1]||0)}
function safeUrl(u){return /^https?:\/\//i.test(u||"")?u:null}
function getJSON(u){return fetch(u,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(u+" "+r.status);return r.json()})}
function nextOf(t){
  var now=Date.now(),fx=(t.fixtures||[]).slice().sort(function(a,b){return a.datum<b.datum?-1:1}),n=null;
  fx.forEach(function(f){if(!n&&!f.ergebnis&&when(f).getTime()+4*3600e3>now)n=f});return n}
function daysTo(f){var now=new Date(),p=f.datum.split("-");
  return Math.round((new Date(+p[0],+p[1]-1,+p[2])-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5)}
function dayTxt(d){return d<=0?"Heute!":d===1?"Morgen":"In "+d+" Tagen"}
function rank(t){var r=(t.table||[]).filter(function(x){return norm(x.team)===norm(t.name)})[0];return r?r:null}
function pill(f,t){var h=norm(f.heim)===norm(t.name),a=!h&&norm(f.gast)===norm(t.name);
  if(!f.heim||!(h||a))return null;return el("span",h?"Heim":"Gast","pill "+(h?"h":"g"))}
function venue(f){if(!f.heim)return "";var k=norm(f.heim),sp=CFG.spielorte||{},a="";
  for(var n in sp)if(norm(n)===k)a=sp[n];
  if(!a&&CFG.teams.some(function(c){return norm(c.name)===k}))a=CFG.verein.spiellokal||"";return a}
function venueEl(f){if(!f.heim)return null;var a=venue(f),d=el("div",null,"ven");d.appendChild(document.createTextNode("Spielort: "));
  if(a){var l=el("a",a);l.href="https://www.openstreetmap.org/search?query="+encodeURIComponent(a);l.target="_blank";l.rel="noopener";d.appendChild(l)}
  else d.appendChild(el("span","Adresse folgt","todo"));return d}
function vsText(f){return f.heim?f.heim+" – "+f.gast:"Gegner folgt"}
function fillRow(dl,k,val,link){
  dl.appendChild(el("dt",k));var dd=el("dd");
  if(val){var u=link&&safeUrl(val);if(u){var a=el("a",val);a.href=u;a.target="_blank";a.rel="noopener";dd.appendChild(a)}else dd.textContent=val}
  else dd.appendChild(el("span","folgt","todo"));dl.appendChild(dd)}

function renderTeam(t){
  var own=norm(t.name);
  $("tName").textContent=t.name;
  $("tLiga").textContent=t.liga_name+" · Badische Dart Liga";
  var fx=(t.fixtures||[]).slice().sort(function(a,b){return a.datum<b.datum?-1:1});
  var next=nextOf(t),n=$("next");n.textContent="";n.className="card";
  if(next){
    n.appendChild(el("div",(next.spieltag?next.spieltag+". Spieltag":"Spieltag"),"lbl"));
    var vsd=el("div",vsText(next),"vs"),pp=pill(next,t);if(pp)vsd.insertBefore(pp,vsd.firstChild);n.appendChild(vsd);
    n.appendChild(el("div",fmtDate(next.datum)+(next.heim?" · "+(next.zeit||"20:00")+" Uhr":"")));
    var ve=venueEl(next);if(ve)n.appendChild(ve);
    n.appendChild(el("div",dayTxt(daysTo(next)),"cd"));
  }else n.textContent="Aktuell ist kein Spiel angesetzt.";
  var ul=$("fix");ul.textContent="";
  if(!fx.length)ul.appendChild(el("li","Der Spielplan folgt."));
  fx.forEach(function(f){
    var li=document.createElement("li");
    var d=el("div",null,"d");d.appendChild(document.createTextNode(fmtDate(f.datum)));
    d.appendChild(el("small",f.heim?(f.zeit||"20:00")+" Uhr":""));
    var r=el("div","","r n");
    if(f.ergebnis){r.textContent=f.ergebnis[0]+" : "+f.ergebnis[1];
      var home=norm(f.heim)===own,mine=home?f.ergebnis[0]:f.ergebnis[1],opp=home?f.ergebnis[1]:f.ergebnis[0];
      r.className="r "+(mine>opp?"w":mine<opp?"l":"n");li.className="past"}
    else r.textContent="–";
    var mm=el("div",null,"m"),vl=el("div",vsText(f)),p2=pill(f,t);if(p2)vl.insertBefore(p2,vl.firstChild);mm.appendChild(vl);var v2=venueEl(f);if(v2)mm.appendChild(v2);
    li.appendChild(d);li.appendChild(mm);li.appendChild(r);ul.appendChild(li)});
  var tb=$("tbl");tb.textContent="";
  if(!(t.table||[]).length){tb.appendChild(el("caption","Die Tabelle folgt."));return}
  var th=document.createElement("thead"),hr=document.createElement("tr");
  [["#",""],["Team",""],["Sp",""],["G","hide-s"],["U","hide-s"],["V","hide-s"],["Sets","hide-s"],["Legs","hide-s"],["Pkt",""]].forEach(function(c){hr.appendChild(el("th",c[0],c[1]))});
  th.appendChild(hr);tb.appendChild(th);
  var tbd=document.createElement("tbody");
  t.table.forEach(function(r){
    var tr=document.createElement("tr");if(norm(r.team)===own)tr.className="own";
    [[r.platz,""],[r.team,""],[r.spiele,""],[r.g,"hide-s"],[r.u,"hide-s"],[r.v,"hide-s"],[r.sets,"hide-s"],[r.legs,"hide-s"],[r.punkte,""]].forEach(function(c){tr.appendChild(el("td",c[0],c[1]))});
    tbd.appendChild(tr)});
  tb.appendChild(tbd)}

function renderStart(){
  var v=CFG.verein;
  $("beschr").textContent=v.beschreibung||(v.name+" ist ein Dartverein aus "+(v.ort||"der Region")+" und spielt in der Badischen Dart Liga.");
  var f=$("facts");f.textContent="";
  [["Verein",v.name],["Ort",v.ort],["Gegründet",v.gegruendet],["Teams",String(DATA.teams.length)],["Training",v.training],["Spieltag","freitags, 20 Uhr"]].forEach(function(p){
    var d=el("div",null,"fact");d.appendChild(el("small",p[0]));d.appendChild(el("b",p[1]||"folgt"));f.appendChild(d)});
  var tc=$("teamCards");tc.textContent="";
  DATA.teams.forEach(function(t){
    var a=el("a",null,"tc");a.href="#"+t.slug;
    a.appendChild(el("h3",t.name));a.appendChild(el("span",t.liga_name));
    var r=rank(t);a.appendChild(el("span",r?"Platz "+r.platz+" · "+r.punkte+" Punkte":"Tabelle folgt"));
    a.appendChild(el("div","Zum Team →","go"));tc.appendChild(a)});
  var na=$("nextAll");na.textContent="";
  var any=false;
  DATA.teams.forEach(function(t){var n=nextOf(t);if(!n)return;any=true;
    var li=document.createElement("li");
    var d=el("div",null,"d");d.appendChild(document.createTextNode(fmtDate(n.datum)));d.appendChild(el("small",n.heim?(n.zeit||"20:00")+" Uhr":""));
    var m=el("div",null,"m");m.appendChild(el("b",t.name));var vl=el("div",vsText(n)),p3=pill(n,t);if(p3)vl.insertBefore(p3,vl.firstChild);m.appendChild(vl);var v3=venueEl(n);if(v3)m.appendChild(v3);
    m.appendChild(el("div",dayTxt(daysTo(n)),"dd2"));li.appendChild(d);li.appendChild(m);li.className="two";na.appendChild(li)});
  if(!any)na.appendChild(el("li","Aktuell sind keine Spiele angesetzt."));
  var vs=$("vorstand");vs.textContent="";
  if(v.vorstand&&v.vorstand.length)v.vorstand.forEach(function(p){fillRow(vs,p.rolle,p.name)});
  else vs.appendChild(el("span","Der Vorstand wird noch eingetragen.","todo"));
  $("willkommen").textContent=v.willkommen||"Interesse am Dartspielen? Schau beim Training vorbei oder melde dich über die Kontaktdaten.";
  var dl=$("info");dl.textContent="";
  fillRow(dl,"Training",v.training);fillRow(dl,"Spiellokal",v.spiellokal);fillRow(dl,"Kontakt",v.kontakt);
  fillRow(dl,"Instagram",v.instagram,true);fillRow(dl,"Facebook",v.facebook,true)}

function route(){
  var h=(location.hash||"#start").slice(1),t=null;
  DATA.teams.forEach(function(x){if(x.slug===h)t=x});
  $("vStart").hidden=!!t;$("vTeam").hidden=!t;
  if(t)renderTeam(t);else renderStart();
  Array.prototype.forEach.call($("tabs").children,function(a){
    if(a.getAttribute("href")==="#"+(t?t.slug:"start"))a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  document.title=(t?t.name+" · ":"")+CFG.verein.name;
  window.scrollTo(0,0)}

function init(){
  var v=CFG.verein;
  DATA.teams.forEach(function(t,i){var c=CFG.teams[i]||{};t.slug=slug(c.slug||t.name.replace(/^dc ph(ö|oe)nix\s*/i,"")||t.name)||("team"+i)});
  $("vname").textContent=v.name;$("vsub").textContent="Dart"+(v.ort?" · "+v.ort:"");
  $("entwurf").hidden=!v.entwurf;
  var lg=$("logo");if(v.logo){lg.onload=function(){lg.hidden=false};lg.onerror=function(){lg.hidden=true};lg.src=v.logo}
  var tabs=$("tabs");
  [["Start","start"]].concat(DATA.teams.map(function(t){return [t.name.replace(/^DC Phönix\s*/i,"")||t.name,t.slug]})).forEach(function(p){
    var a=el("a",p[0]);a.href="#"+p[1];tabs.appendChild(a)});
  var lk=$("links");
  [["Impressum",v.impressum],["Datenschutz",v.datenschutz]].forEach(function(p){
    var u=safeUrl(p[1])||(p[1]&&/^[\w.\-\/]+$/.test(p[1])?p[1]:null);
    if(u){var a=el("a",p[0]);a.href=u;lk.appendChild(a)}else lk.appendChild(el("span",p[0]+" folgt"))});
  var u=DATA.updated?new Date(DATA.updated):null;
  $("upd").textContent=u&&!isNaN(u)?"Stand: "+u.toLocaleString("de-DE",{dateStyle:"medium",timeStyle:"short"}):"";
  window.addEventListener("hashchange",route);route()}
