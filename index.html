<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DC Phönix Durmersheim</title>
<style>
:root{--bg:#F2E6C9;--card:#FFFBF0;--fg:#14110F;--mute:#6A6150;--line:#D9CCAA;--navy:#14110F;--flame:#D8342A;--flame-fg:#fff;--green:#1F7A4D;--own:#F9D9C9;--win:#1F7A4D;--loss:#C0301F;--warn:#FFE9A8;--warn-fg:#5A4500;--board:#16251C;--board-fg:#F2E6C9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#100E0C;--card:#1B1814;--fg:#F2E6C9;--mute:#A89E88;--line:#2E2921;--navy:#0A0908;--own:#40211A;--win:#4CC083;--loss:#F0745F;--warn:#3B3210;--warn-fg:#F3DE8A;--board:#0F1B14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#100E0C;--card:#1B1814;--fg:#F2E6C9;--mute:#A89E88;--line:#2E2921;--navy:#0A0908;--own:#40211A;--win:#4CC083;--loss:#F0745F;--warn:#3B3210;--warn-fg:#F3DE8A;--board:#0F1B14;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
h1,h2,h3{font-family:Impact,"Arial Narrow","Helvetica Neue Condensed",system-ui,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.05em;margin:0;text-wrap:balance}
a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:relative;overflow:hidden;background:var(--navy);color:#F2E6C9;padding-block:calc(26px + env(safe-area-inset-top,0px)) 34px;border-bottom:6px solid var(--flame);box-shadow:0 6px 0 var(--green)}
.board{position:absolute;right:-70px;top:50%;width:300px;height:300px;transform:translateY(-50%) rotate(12deg);opacity:.95}
.hero{position:relative}
.brand{display:flex;align-items:center;gap:16px;min-width:0;max-width:calc(100% - 90px)}
.brand img{height:76px;width:76px;object-fit:cover;border-radius:50%;border:3px solid #F2E6C9;flex:none}
.brand h1{font-size:clamp(1.9rem,8vw,3.2rem);line-height:1;text-shadow:2px 2px 0 var(--flame)}
.brand small{display:block;color:#E2D5B3;letter-spacing:.18em;text-transform:uppercase;font-size:.75rem;margin-top:8px}
.banner{background:var(--warn);color:var(--warn-fg);padding-block:10px;font-size:.9rem}
main{padding-block:26px 40px;display:grid;gap:30px}
section{min-width:0}
h2{font-size:1.5rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:22px;height:22px;flex:none;border-radius:50%;background:radial-gradient(circle,var(--flame) 0 22%,var(--green) 23% 45%,var(--fg) 46% 60%,var(--card) 61% 100%);border:2px solid var(--fg)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:700;padding:9px 16px;border-radius:999px;border:2px solid var(--fg);background:var(--card);color:var(--fg);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--flame);border-color:var(--flame);color:var(--flame-fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.next .card{background:var(--board);color:var(--board-fg);border:3px solid #5A4630;border-radius:14px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06);padding:20px}
.next .lbl{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.next .vs{font-family:Impact,"Arial Narrow",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.03em;font-size:clamp(1.4rem,6vw,2rem);line-height:1.15;margin:8px 0;overflow-wrap:anywhere}
.next .cd{display:inline-block;margin-top:10px;background:var(--flame);color:#fff;font-family:Impact,"Arial Narrow",system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;font-size:1.2rem;padding:4px 14px;border-radius:6px}
.next .card.err{color:var(--loss)}
.fix{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.fix li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--green);border-radius:10px;padding:10px 12px}
.fix li.past{border-left-color:var(--line)}
.fix .d{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.fix .d small{display:block;font-weight:400;color:var(--mute)}
.fix .m{min-width:0;overflow-wrap:anywhere}
.fix .r{font-family:Impact,"Arial Narrow",system-ui,sans-serif;font-size:1.2rem;letter-spacing:.04em;font-variant-numeric:tabular-nums;text-align:right}
.fix .r.w{color:var(--win)}.fix .r.l{color:var(--loss)}.fix .r.n{color:var(--mute)}
.scroll{overflow-x:auto;border:2px solid var(--fg);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;background:var(--navy);color:#F2E6C9;border-bottom:0}
th:nth-child(2),td:nth-child(2){text-align:left;white-space:normal;min-width:0}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(1) td:first-child{box-shadow:inset 4px 0 0 var(--green)}
tr.own td{background:var(--own);font-weight:700}
td:last-child{font-family:Impact,"Arial Narrow",system-ui,sans-serif;font-size:1.1rem;font-weight:400}
@media (max-width:640px){.hide-s{display:none}.board{width:230px;height:230px;right:-90px;opacity:.3}}
dl{display:grid;grid-template-columns:max-content 1fr;gap:10px 16px;margin:0}
dt{color:var(--mute);text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;padding-top:3px}dd{margin:0;overflow-wrap:anywhere}
.todo{color:var(--mute);font-style:italic}
footer{border-top:1px solid var(--line);padding-block:16px calc(24px + env(safe-area-inset-bottom,0px));color:var(--mute);font-size:.85rem;display:flex;flex-wrap:wrap;gap:6px 18px}
.err{color:var(--loss)}
#links{display:flex;gap:16px;flex-wrap:wrap}
</style>
</head>
<body>
<header><svg class="board" viewBox="-100 -100 200 200" aria-hidden="true"><circle r="100" fill="#14110F"/><circle r="86" fill="none" stroke="#D8342A" stroke-width="10"/><circle r="86" fill="none" stroke="#1F7A4D" stroke-width="10" stroke-dasharray="27.02 27.02" transform="rotate(-9)"/><circle r="70" fill="none" stroke="#F2E6C9" stroke-width="22"/><circle r="70" fill="none" stroke="#14110F" stroke-width="22" stroke-dasharray="21.99 21.99" transform="rotate(-9)"/><circle r="54" fill="none" stroke="#D8342A" stroke-width="9"/><circle r="54" fill="none" stroke="#1F7A4D" stroke-width="9" stroke-dasharray="16.96 16.96" transform="rotate(-9)"/><circle r="40" fill="none" stroke="#14110F" stroke-width="20"/><circle r="40" fill="none" stroke="#F2E6C9" stroke-width="20" stroke-dasharray="12.57 12.57" transform="rotate(-9)"/><circle r="14" fill="#1F7A4D"/><circle r="6" fill="#D8342A"/></svg><div class="wrap hero"><div class="brand">
<img id="logo" alt="Vereinslogo" hidden>
<div><h1 id="vname">DC Phönix Durmersheim</h1><small id="vsub">Dart</small></div>
</div></div></header>
<div class="banner" id="entwurf" hidden><div class="wrap">Entwurf eines Vereinsmitglieds, noch nicht vom Verein freigegeben.</div></div>

<main class="wrap">
<div class="tabs" id="tabs" role="group" aria-label="Team wählen" hidden></div>
<section class="next" aria-live="polite"><h2>Nächstes Spiel</h2><div class="card" id="next">Lade …</div></section>
<section><h2>Spielplan</h2><ul class="fix" id="fix"></ul></section>
<section><h2>Tabelle</h2><div class="scroll"><table id="tbl"></table></div><p class="todo" id="liga"></p></section>
<section><h2>Mitmachen</h2><div class="card"><dl id="info"></dl></div></section>
</main>

<footer class="wrap"><span id="upd"></span><span id="links"></span></footer>

<script>
(function(){
"use strict";
var CFG=null,DATA=null,cur=0;
var $=function(id){return document.getElementById(id)};
function el(tag,txt,cls){var e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e}
function norm(s){return String(s||"").trim().toLowerCase()}
function fmtDate(iso){var p=iso.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);
  return d.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"})}
function when(f){var p=f.datum.split("-"),t=(f.zeit||"20:00").split(":");
  return new Date(+p[0],+p[1]-1,+p[2],+t[0]||20,+t[1]||0)}
function safeUrl(u){return /^https?:\/\//i.test(u||"")?u:null}
function getJSON(u){return fetch(u,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(u+" "+r.status);return r.json()})}

function team(){return DATA.teams[cur]}
function render(){
  var t=team(),own=norm(t.name);
  var fx=(t.fixtures||[]).slice().sort(function(a,b){return a.datum<b.datum?-1:1});
  var now=new Date(),next=null;
  fx.forEach(function(f){if(!next&&!f.ergebnis&&when(f).getTime()+4*3600e3>now.getTime())next=f});
  var n=$("next");n.textContent="";
  if(next){
    n.appendChild(el("div",t.name+" · "+(next.spieltag?next.spieltag+". Spieltag":"Spieltag"),"lbl"));
    var vs=next.heim?(next.heim+"  –  "+next.gast):"Gegner folgt";
    n.appendChild(el("div",vs,"vs"));
    n.appendChild(el("div",fmtDate(next.datum)+(next.heim?" · "+(next.zeit||"20:00")+" Uhr":"")));
    var days=Math.round((new Date(+next.datum.slice(0,4),+next.datum.slice(5,7)-1,+next.datum.slice(8,10))-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);
    n.appendChild(el("div",days<=0?"Heute!":days===1?"Morgen":"In "+days+" Tagen","cd"));
  }else n.textContent="Aktuell ist kein Spiel angesetzt.";

  var ul=$("fix");ul.textContent="";
  if(!fx.length)ul.appendChild(el("li","Der Spielplan folgt."));
  fx.forEach(function(f){
    var li=document.createElement("li");
    var d=el("div",null,"d");d.appendChild(document.createTextNode(fmtDate(f.datum)));
    d.appendChild(el("small",f.heim?(f.zeit||"20:00")+" Uhr":""));
    var m=el("div",f.heim?f.heim+" – "+f.gast:"Gegner folgt","m");
    var r=el("div","","r n");
    if(f.ergebnis){
      r.textContent=f.ergebnis[0]+" : "+f.ergebnis[1];
      var home=norm(f.heim)===own,mine=home?f.ergebnis[0]:f.ergebnis[1],opp=home?f.ergebnis[1]:f.ergebnis[0];
      r.className="r "+(mine>opp?"w":mine<opp?"l":"n");li.className="past";
    }else r.textContent="–";
    li.appendChild(d);li.appendChild(m);li.appendChild(r);ul.appendChild(li);
  });

  var tb=$("tbl");tb.textContent="";
  var th=document.createElement("thead"),hr=document.createElement("tr");
  [["#",""],["Team",""],["Sp",""],["G","hide-s"],["U","hide-s"],["V","hide-s"],["Sets","hide-s"],["Legs","hide-s"],["Pkt",""]].forEach(function(c){var h=el("th",c[0],c[1]);hr.appendChild(h)});
  th.appendChild(hr);tb.appendChild(th);
  var tbd=document.createElement("tbody");
  (t.table||[]).forEach(function(r){
    var tr=document.createElement("tr");if(norm(r.team)===own)tr.className="own";
    [[r.platz,""],[r.team,""],[r.spiele,""],[r.g,"hide-s"],[r.u,"hide-s"],[r.v,"hide-s"],[r.sets,"hide-s"],[r.legs,"hide-s"],[r.punkte,""]].forEach(function(c){tr.appendChild(el("td",c[0],c[1]))});
    tbd.appendChild(tr);
  });
  tb.appendChild(tbd);
  $("liga").textContent=(t.table&&t.table.length)?t.liga_name+" · Badische Dart Liga":"Tabelle folgt.";
}

function init(){
  var v=CFG.verein;
  $("vname").textContent=v.name;document.title=v.name;
  $("vsub").textContent="Dart"+(v.ort?" · "+v.ort:"");
  $("entwurf").hidden=!v.entwurf;
  var lg=$("logo");
  if(v.logo){lg.onload=function(){lg.hidden=false};lg.onerror=function(){lg.hidden=true};lg.src=v.logo}
  var dl=$("info");
  function row(k,val,link){
    dl.appendChild(el("dt",k));
    var dd=el("dd");
    if(val){var u=link&&safeUrl(val);if(u){var a=el("a",val);a.href=u;a.target="_blank";a.rel="noopener";dd.appendChild(a)}else dd.textContent=val}
    else dd.appendChild(el("span","folgt","todo"));
    dl.appendChild(dd);
  }
  row("Training",v.training);row("Spieltag","freitags, regulär 20 Uhr");row("Spiellokal",v.spiellokal);
  row("Kontakt",v.kontakt);row("Instagram",v.instagram,true);row("Facebook",v.facebook,true);
  var lk=$("links");
  [["Impressum",v.impressum],["Datenschutz",v.datenschutz]].forEach(function(p){
    var u=safeUrl(p[1])||(p[1]&&/^[\w.\-\/]+$/.test(p[1])?p[1]:null);
    if(u){var a=el("a",p[0]);a.href=u;lk.appendChild(a);lk.appendChild(document.createTextNode(" "))}
    else lk.appendChild(el("span",p[0]+" folgt"," "));
  });
  var u=DATA.updated?new Date(DATA.updated):null;
  $("upd").textContent=u&&!isNaN(u)?"Stand: "+u.toLocaleString("de-DE",{dateStyle:"medium",timeStyle:"short"}):"";
  var tabs=$("tabs");
  if(DATA.teams.length>1){
    tabs.hidden=false;
    DATA.teams.forEach(function(t,i){
      var b=el("button",t.name);b.type="button";b.setAttribute("aria-pressed",i===cur);
      b.onclick=function(){cur=i;Array.prototype.forEach.call(tabs.children,function(x,j){x.setAttribute("aria-pressed",j===i)});render()};
      tabs.appendChild(b);
    });
  }
  render();
}

Promise.all([getJSON("config.json"),getJSON("data.json")]).then(function(r){CFG=r[0];DATA=r[1];
  if(!DATA.teams||!DATA.teams.length)throw new Error("keine Teams");init()})
.catch(function(e){var n=$("next");n.textContent="Daten konnten nicht geladen werden.";n.className="card err";console.error(e)});
})();
</script>
</body>
</html>
