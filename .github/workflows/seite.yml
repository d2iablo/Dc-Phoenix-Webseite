name: Daten aktualisieren und Seite veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"        # alle 6 Stunden
    - cron: "*/30 19-23 * * 5"    # freitags abends alle 30 Minuten (Spieltag)
  workflow_dispatch:               # Knopf "Run workflow" im Reiter Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tabelle und Spielplan von der BDL holen
        id: update
        continue-on-error: true
        run: python update.py

      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp index.html config.json data.json _site/
          cp logo.* _site/ 2>/dev/null || true
          cp logo-*.png _site/ 2>/dev/null || true
          cp -r fotos _site/ 2>/dev/null || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Hinweis, wenn das Auslesen nicht geklappt hat
        if: steps.update.outcome == 'failure'
        run: |
          echo "::error::Das Auslesen der BDL-Seite ist fehlgeschlagen. Die Seite zeigt die letzten bekannten Daten."
          exit 1
